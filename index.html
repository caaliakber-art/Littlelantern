<style>
/* Layout: one column "garden path"; cover, kid home with garden strip + world map, focused lesson card, score card, parents' corner */
:root{
  --bg:#FBF4F2; --surface:#FFFFFF; --ink:#2B2430; --muted:#6F6370; --line:#EBDCDE;
  --rose:#B9587A; --rose-soft:#F6DFE7; --green:#1F5C4A; --green-soft:#DCEDE5;
  --gold:#C98F22; --gold-soft:#FBEFD3; --sky:#E8EEF8; --bad:#B4462F; --bad-soft:#F8E1DA;
  --f-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1920; --surface:#26232C; --ink:#F3ECEF; --muted:#B7ABB4; --line:#3A3441;
  --rose:#E991AE; --rose-soft:#47293A; --green:#74C8A6; --green-soft:#1D3A31;
  --gold:#EBC06A; --gold-soft:#3E3220; --sky:#252B38; --bad:#F09A82; --bad-soft:#47271F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1920; --surface:#26232C; --ink:#F3ECEF; --muted:#B7ABB4; --line:#3A3441;
  --rose:#E991AE; --rose-soft:#47293A; --green:#74C8A6; --green-soft:#1D3A31;
  --gold:#EBC06A; --gold-soft:#3E3220; --sky:#252B38; --bad:#F09A82; --bad-soft:#47271F; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:760px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.ar{font-family:var(--f-ar);direction:rtl;line-height:1.9}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
a{color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;
  font-family:var(--f-display);font-weight:600;font-size:1.05rem;background:var(--green);color:var(--bg);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.rose{background:var(--rose)} .btn.gold{background:var(--gold);color:#2B2430}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.92rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--r);padding:18px;border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:700;letter-spacing:.02em}
.chip.green{background:var(--green-soft);color:var(--green)} .chip.rose{background:var(--rose-soft);color:var(--rose)}
.chip.gold{background:var(--gold-soft);color:var(--gold)} .chip.plain{background:var(--sky);color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);min-height:44px}

/* cover */
.cover{display:grid;gap:18px}
.cover-art{border-radius:24px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--gold-soft)}
.cover-art img{width:100%;height:100%;object-fit:cover;object-position:50% 70%;display:block}
.us{width:min(280px,64%);margin:-110px auto 0;border-radius:24px;overflow:hidden;border:5px solid var(--surface);box-shadow:0 12px 30px rgba(43,36,48,.22);position:relative}
.us img{display:block;width:100%}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .bism{font-family:var(--f-ar);font-size:1.5rem;color:var(--green);direction:rtl}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.kidtile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line)}
.kidtile:hover{border-color:var(--rose)}
.sym{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:2rem}
.kidtile b{font-family:var(--f-display);font-weight:600;font-size:1.15rem}

/* pin */
.pin{display:grid;gap:18px;justify-items:center;text-align:center}
.dots{display:flex;gap:14px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--rose)}
.dots i.on{background:var(--rose)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* kid home */
.hello{display:flex;align-items:center;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.garden{border-radius:var(--r);overflow:hidden;background:linear-gradient(var(--sky),var(--green-soft));border:1px solid var(--line)}
.garden svg{display:block;width:100%;height:auto}
.garden-cap{padding:8px 14px 12px;font-size:.88rem;color:var(--muted)}
.today{display:grid;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.task .tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800}
.task.done .tick{background:var(--green);border-color:var(--green);color:var(--bg)}
.task .tx{flex:1;min-width:0}
.task .tx small{display:block;color:var(--muted)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.world{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r);text-align:left;border:2px solid transparent;min-height:150px}
.world .wicon{font-size:1.9rem}
.world h3{font-size:1.2rem}
.world .bar{height:8px;border-radius:9px;background:rgba(127,127,127,.18);overflow:hidden;margin-top:auto}
.world .bar i{display:block;height:100%;background:currentColor}
.w-aq{background:var(--green-soft);color:var(--green)} .w-ad{background:var(--rose-soft);color:var(--rose)} .w-ar{background:var(--gold-soft);color:var(--gold)}
.world p{color:var(--ink);font-size:.92rem}
.world.locked{background:var(--surface);border:2px dashed var(--line);color:var(--muted);cursor:default}
.lantern{display:flex;gap:16px;align-items:center}
.lantern svg{flex:none}

/* world list */
.lessons{display:grid;gap:10px}
.lesson{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.lesson .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none;font-size:1.1rem}
.lesson .tx{flex:1;min-width:0}
.lesson .ar{font-size:1.25rem;color:var(--green)}
.lesson.off{opacity:.6;cursor:default}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05rem;white-space:nowrap}

/* player */
.prog{height:10px;border-radius:9px;background:var(--line);overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--rose);transition:width .3s}
.stage{display:grid;gap:16px}
.daddy{display:flex;gap:10px;align-items:center;font-weight:800;color:var(--gold);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.say{font-size:1.3rem;line-height:1.55;font-weight:600}
.bigar{font-family:var(--f-ar);font-size:2.4rem;color:var(--green);direction:rtl;text-align:center;line-height:1.8}
.tr{font-style:italic;color:var(--muted);text-align:center}
.key{background:var(--gold-soft);border:2px solid var(--gold);border-radius:var(--r);padding:18px}
.key .lbl{font-weight:800;color:var(--gold);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
.key p{font-size:1.2rem;font-weight:700;margin-top:6px}
.taps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tapit{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;background:var(--surface);border:2px solid var(--line);min-height:120px;text-align:center}
.tapit .ic{font-size:2.2rem}
.tapit.open{border-color:var(--green);background:var(--green-soft)}
.tapit .rev{font-size:.85rem;font-weight:800;color:var(--green)}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);text-align:left;font-weight:700;font-size:1.08rem;min-height:56px}
.opt.glyph{font-family:var(--f-ar);font-size:2.2rem;text-align:center;padding:4px}
.opts.grid4{grid-template-columns:repeat(2,1fr)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:12px 14px;border-radius:14px;font-weight:700}
.fb.ok{background:var(--green-soft);color:var(--green)} .fb.no{background:var(--bad-soft);color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{padding:10px;border-radius:14px;background:var(--surface);border:2px solid var(--line);min-height:56px;font-weight:700;font-size:.95rem}
.mi .ar{font-size:1.3rem;display:block;color:var(--green)}
.mi.sel{border-color:var(--gold);background:var(--gold-soft)}
.mi.done{border-color:var(--green);background:var(--green-soft);opacity:.55}
.sortcard{text-align:center;font-size:1.3rem;font-weight:700;padding:26px 18px}
.counter{display:grid;place-items:center;gap:10px}
.counter button{width:120px;height:120px;border-radius:50%;background:var(--rose-soft);border:3px solid var(--rose);font-family:var(--f-display);font-size:2.4rem;font-weight:700;color:var(--rose)}
.built{min-height:64px;padding:10px;border-radius:16px;border:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:flex-start}
.chunks{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center}
.chunk{font-family:var(--f-ar);font-size:1.45rem;padding:4px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.chunk.placed{background:var(--green-soft);border-color:var(--green)}
.letters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.letter{display:grid;justify-items:center;gap:2px;padding:12px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.letter .g{font-family:var(--f-ar);font-size:3.4rem;line-height:1.3;color:var(--green)}
.letter.open{border-color:var(--gold);background:var(--gold-soft)}
.src{font-size:.8rem;color:var(--muted)}

/* score */
.score{display:grid;gap:14px;justify-items:center;text-align:center}
.score .pic{width:min(260px,70%);border-radius:24px;overflow:hidden;background:var(--gold-soft)}
.pic img.g1{filter:grayscale(.55) brightness(.8)}
.pic img.g3{filter:saturate(1.25) brightness(1.08)}
.pic:has(img.g3){box-shadow:0 0 0 4px var(--gold),0 0 36px 6px var(--gold)}
.drive{width:100%;max-width:440px;display:grid;gap:6px}
.lane{position:relative;height:84px;overflow:hidden;border-bottom:6px dashed var(--line)}
.lane img{position:absolute;bottom:4px;height:64px;left:calc(50% - 70px);transform:scaleX(-1);animation:drive 1.8s cubic-bezier(.2,.7,.3,1) both}
@keyframes drive{from{left:-45%}to{left:calc(50% - 70px)}}
.hv{height:24px;vertical-align:middle;margin-right:6px}
.score .pic img{display:block;width:100%}
.bigstars{font-size:2.6rem;color:var(--gold);letter-spacing:6px}

/* parents */
.ph{display:flex;gap:16px;align-items:center}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:22px;flex:none}
.road svg{display:block;width:100%;height:auto;margin-top:8px}
.sect{display:grid;gap:12px}
.sect h2{font-size:1.25rem}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.li .tx{flex:1;min-width:160px}
.preview{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:6px;font-size:.92rem;width:100%}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.syms{display:flex;flex-wrap:wrap;gap:8px}
.syms button{width:48px;height:48px;border-radius:50%;font-size:1.5rem;border:2px solid var(--line);background:var(--surface)}
.syms button.on{border-color:var(--rose);background:var(--rose-soft)}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
/* duels: one phone, two players, top half turned to face the far player */
.duelcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.duelcard .tx{flex:1;min-width:200px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.game{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);text-align:left}
.game.on{border-color:var(--rose);background:var(--rose-soft)}
.game .gi{font-family:var(--f-ar);font-size:2rem;color:var(--green);line-height:1.4}
.duelwrap{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:1fr auto 1fr;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);transition:grid-template-rows .35s ease}
.half{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:10px 14px;min-height:0}
.half.p1{background:var(--rose-soft)} .half.p2{background:var(--green-soft);transform:rotate(180deg)}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.hhead .pts{font-size:1.5rem;font-variant-numeric:tabular-nums}
.hq{text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(1.1rem,3.4vh,1.6rem)}
.hq .ar{font-size:clamp(2.2rem,7vh,3.6rem);color:var(--green);line-height:1.3;display:block}
.field{position:relative;flex:1;min-height:0}
.sgrid{position:absolute;inset:0;display:grid;gap:8px;grid-template-columns:repeat(var(--c),1fr);align-content:center}
.sgrid button{background:var(--surface);border-radius:16px;font-family:var(--f-ar);font-size:clamp(1.6rem,6vh,3rem);min-height:48px;border:2px solid var(--line);line-height:1.2;padding:4px}
.sgrid button.nm{font-family:var(--f-display);font-size:clamp(1rem,3vh,1.4rem)}
.sgrid button.hit{background:var(--green);color:var(--bg);border-color:var(--green)}
.sgrid button.miss{background:var(--bad-soft);border-color:var(--bad)}
.fall{position:absolute;width:64px;height:64px;margin-left:-32px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-family:var(--f-ar);font-size:2.2rem;line-height:1;display:grid;place-items:center}
.half.frozen::after{content:"❄";position:absolute;inset:0;display:grid;place-items:center;background:rgba(127,127,127,.35);font-size:3.5rem;z-index:2}
.mid{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--surface);border-block:2px solid var(--line)}
.mid button{width:44px;height:44px;border-radius:50%;background:var(--bg);font-size:1.1rem;font-weight:800}
.mid .info{flex:1;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.rope{width:100%;height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,#B48A5A 0 10px,#9A7148 10px 20px);position:relative}
.rope::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--gold);border:3px solid var(--surface)}
@media (max-width:420px){h1{font-size:1.75rem}.say{font-size:1.18rem}.pad{grid-template-columns:repeat(3,64px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== CONTENT ===================== */
const AQ=[

 {t:'say',text:"Allah is your Rabb. Ar-Rabb means the One who creates everything, takes care of everything, and owns everything.",ar:'اللَّهُ رَبِّي',tr:'Allahu Rabbi',mean:'Allah is my Rabb'},
 {t:'say',text:"Allah is also the Rabb of things we cannot see. He created the angels from light. The angels always worship Allah and never disobey Him."},
 {t:'say',text:"Allah created the jinn from fire. Some jinn are Muslims who believe in Allah. Others disobey Allah and call people to bad things. Their leader is Shaytan."},

  {q:'Who gives you everything you need to stay alive?',o:['Allah','The shop','My toys'],why:'Food, water and air all come from Allah.'},

}

/* ===================== STATE + STORAGE ===================== */
const LKEY='deeniyath-garden-v1';
function emptyState(){return{settings:{},kids:{},progress:{},approvals:{},deeds:{},access:[]}}
let S=emptyState();
try{const raw=localStorage.getItem(LKEY);if(raw)S=Object.assign(emptyState(),JSON.parse(raw))}catch(e){}
let mode='local',db=null,dbReady=false;
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}
async function put(path,obj){
  saveLocal();
  if(mode!=='db')return;
  try{await db.doc(path).set(obj)}catch(e){toast(e&&e.code==='quota_exceeded'?'Storage is full. Ask Daddy.':'Could not save to the family space. Check you are signed in.')}
}
async function del(path){saveLocal();if(mode!=='db')return;try{await db.doc(path).delete()}catch(e){}}
const saveSettings=()=>put('fam/settings',S.settings);
const saveApprovals=()=>put('fam/approvals',S.approvals);
const saveKid=id=>put('kids/'+id,S.kids[id]);
const saveProg=id=>put('progress/'+id,S.progress[id]);
const saveDeed=id=>put('deeds/'+id,S.deeds[id]);

function subscribeAll(onErr){
  const local=JSON.parse(JSON.stringify(S));let first=true;
  const err=e=>{onErr&&onErr(e)};
  const coll=(name,key)=>db.collection(name).onSnapshot(s=>{
    const m={};s.docs.forEach(x=>m[x.id]=x.data());S[key]=m;saveLocal();soft();
  },err);
  coll('kids','kids');coll('progress','progress');coll('deeds','deeds');
  db.collection('fam').onSnapshot(async s=>{
    const m={};s.docs.forEach(x=>m[x.id]=x.data());
    if(first){first=false;
      if(!m.settings&&local.settings&&local.settings.parentPin){ // move this device's data into the family space once
        S=Object.assign(local,{access:S.access||[]});await put('fam/settings',S.settings);await put('fam/approvals',S.approvals);
        for(const k in S.kids)await put('kids/'+k,S.kids[k]);
        for(const k in S.progress)await put('progress/'+k,S.progress[k]);
        for(const k in S.deeds)await put('deeds/'+k,S.deeds[k]);
        return;}}
    S.settings=Object.assign({},m.settings||{});S.approvals=Object.assign({},m.approvals||{});
    S.access=(m.access&&m.access.members)||[];
    dbReady=true;saveLocal();soft();
  },err);
}

/* ---------- lesson player ---------- */
function startLesson(id){
  const l=byId[id];let steps=l.steps;
  if(l.gen)steps=letterSteps(l);
  ui.L={id,steps,i:0,miss:0,quick:false,st:{}};prepStep();go('play');
}
function letterSteps(l){
  const pool=LETTERS.slice(0,LV.indexOf(l)*4+4);
  const qs=shuffle(l.set.flatMap(x=>[
    {q:`Which letter is ${x[1]}?`,o:[x[0],...shuffle(pool.filter(y=>y!==x)).slice(0,3).map(y=>y[0])],glyph:true,why:`${x[1]} looks like this: ${x[0]}`},
    {q:'What is the name of this letter?',big:x[0],o:[x[1],...shuffle(pool.filter(y=>y!==x)).slice(0,3).map(y=>y[1])],why:`${x[0]} is ${x[1]}. It sounds like ${x[3]}.`}]));
  return [{t:'say',text:`New letters today, {name}! Tap each letter to hear its name and see its sound.`},{t:'letters',set:l.set},{t:'quiz',qs,grid:true}];
}
function curStep(){return ui.L.steps[ui.L.i]}
function prepStep(){const s=curStep();const st={};
  if(s.t==='quiz'){st.q=0;st.order=s.qs.map(q=>shuffle(q.o));st.ans=null}
  if(s.t==='tap')st.open={};
  if(s.t==='letters')st.open={};
  if(s.t==='sort'){st.items=shuffle(s.items);st.k=0;st.ans=null}
  if(s.t==='match'){st.left=shuffle(s.pairs.map((p,i)=>i));st.right=shuffle(s.pairs.map((p,i)=>i));st.sel=null;st.done={}}
  if(s.t==='count')st.c=0;
  if(s.t==='order'){st.pool=shuffle(s.chunks.map((c,i)=>i));st.placed=[]}
  ui.L.st=st;}
function canNext(){const s=curStep(),st=ui.L.st;
  if(s.t==='tap')return Object.keys(st.open).length===s.items.length;
  if(s.t==='letters')return Object.keys(st.open).length===s.set.length;
  if(s.t==='count')return st.c>=s.n;
  if(s.t==='order')return st.placed.length===s.chunks.length;
  if(s.t==='match')return Object.keys(st.done).length===s.pairs.length;
  if(s.t==='sort')return st.k>=s.items.length;
  if(s.t==='quiz')return st.q>=s.qs.length;
  if(s.t==='daddy')return false;
  return true;}
function play(){
  const L=ui.L,l=byId[L.id],s=curStep(),st=L.st,pct=Math.round(L.i/L.steps.length*100);
  let body='';
  const daddy='<div class="daddy">'+lanternMini()+'Daddy says</div>';
  if(s.t==='say')body=`<div class="card stage">${daddy}<p class="say">${fill(s.text)}</p>${s.ar?`<div class="bigar">${s.ar}</div><p class="tr">${esc(s.tr)}</p><p class="tr" style="font-style:normal">${esc(s.mean)}</p>`:''}</div>`;
  else if(s.t==='key')body=`<div class="key"><span class="lbl">Remember this</span><p>${fill(s.text)}</p></div>`;
  else if(s.t==='tap')body=`<h2>${esc(s.prompt)}</h2><div class="taps">${s.items.map((it,i)=>`<button class="tapit ${st.open[i]?'open':''}" data-act="tap" data-i="${i}"><span class="ic" aria-hidden="true">${it[0]}</span><b>${esc(it[1])}</b>${st.open[i]?`<span class="rev">${esc(s.reveal)}</span>`:''}</button>`).join('')}</div>`;
  else if(s.t==='letters')body=`<div class="letters">${s.set.map((x,i)=>`<button class="letter ${st.open[i]?'open':''}" data-act="letter" data-i="${i}"><span class="g">${x[0]}</span><b>${x[1]}${arVoice?' 🔊':''}</b>${st.open[i]?`<span class="small">${x[2]} · sounds like <b>${esc(x[3])}</b></span>`:'<span class="small muted">Tap me</span>'}</button>`).join('')}</div>`;
  else if(s.t==='sort'){const it=st.items[st.k];body=`<h2>${esc(s.prompt)}</h2>${it?`<div class="card sortcard">${esc(it[0])}</div>${st.ans==null?`<div class="row" style="justify-content:center"><button class="btn" data-act="sort" data-v="1">✓ ${esc(s.yes)}</button><button class="btn rose" data-act="sort" data-v="0">✗ ${esc(s.no)}</button></div>`:`<div class="fb ${st.ans?'ok':'no'}">${st.ans?'Yes! ':'Not quite. '}${it[1]?'Allah loves this.':'We keep away from this. It is only for Allah or it is wrong.'}</div><button class="btn" data-act="sortNext">Next</button>`}`:'<div class="fb ok">All sorted. MashaAllah!</div>'}`;}
  else if(s.t==='match'){body=`<h2>${esc(s.prompt)}</h2><div class="match"><div class="col">${st.left.map(i=>{const p=s.pairs[i];return `<button class="mi ${st.sel===i?'sel':''} ${st.done[i]?'done':''}" data-act="mL" data-i="${i}" ${st.done[i]?'disabled':''}>${p[0]?`<span class="ar">${p[0]}</span>`:''}${esc(p[1])}</button>`}).join('')}</div><div class="col">${st.right.map(i=>`<button class="mi ${st.done[i]?'done':''}" data-act="mR" data-i="${i}" ${st.done[i]?'disabled':''}>${esc(s.pairs[i][2])}</button>`).join('')}</div></div>`;}
  else if(s.t==='quiz'){const q=s.qs[st.q];
    body=q?`<p class="muted small">Question ${st.q+1} of ${s.qs.length}</p><h2>${esc(q.q)}</h2>${q.big?`<div class="bigar" style="font-size:4rem">${q.big}</div>`:''}<div class="opts ${q.glyph||s.grid?'grid4':''}">${st.order[st.q].map(o=>{let c='';if(st.ans!=null){if(o===q.o[0])c='right';else if(o===st.ans)c='wrong'}return `<button class="opt ${q.glyph?'glyph':''} ${c}" data-act="ans" data-v="${esc(o)}" ${st.ans!=null?'disabled':''}>${esc(o)}</button>`}).join('')}</div>${st.ans!=null?`<div class="fb ${st.ans===q.o[0]?'ok':'no'}">${st.ans===q.o[0]?'MashaAllah, correct! ':'Not quite. '}${esc(q.why)}</div><button class="btn" data-act="qNext">Next</button>`:''}`:'<div class="fb ok">Quiz finished!</div>';}
  else if(s.t==='dhikr'){body=`<div class="card stage"><span class="chip rose" style="justify-self:start">${esc(l.when)}</span><div class="bigar">${l.ar}</div><p class="tr">${esc(l.tr)}</p><p style="font-weight:700;text-align:center">${esc(l.mean)}</p>${l.extra?`<hr style="border:0;border-top:1px solid var(--line);width:100%"><div class="bigar" style="font-size:1.7rem">${l.extra.ar}</div><p class="tr">${esc(l.extra.tr)}</p><p class="small" style="text-align:center">${esc(l.extra.mean)}</p>`:''}<p class="src">Source: ${esc(l.src)}</p></div>`;}

/* ---------- duels ---------- */
function todayTasks(k){const P=prog(k),t=dayKey(),log=(P.log||[]).filter(e=>dayKey(new Date(e.at))===t);
  return ['aq','ad','ar'].map(w=>{const did=log.some(e=>byId[e.l]?.world===w);const nx=nextIn(w)||(w==='ad'?AD.find(l=>P.done[l.id]):null);return{w,did,nx}})}
function duelOpen(k){const t=dayKey();return !!ui.duelUnlocked||(prog(k).log||[]).some(e=>dayKey(new Date(e.at))===t)}
function learned(k){const P=prog(k);const L=LV.filter(l=>P.done[l.id]).flatMap(l=>l.set);return L.length>=4?L:LETTERS.slice(0,4)}
const FAMILIES=[['ب','ت','ث','ن','ي'],['ج','ح','خ'],['د','ذ'],['ر','ز'],['س','ش'],['ص','ض'],['ط','ظ'],['ع','غ'],['ف','ق']];
const LBY=Object.fromEntries(LETTERS.map(x=>[x[0],x]));
const GAMES={
 slap:{name:'Letter Slap',icon:'ب',how:'A letter name is called. Slap it on your side before the other player. A wrong slap freezes you for a second. First to 7 wins.'},
 dots:{name:'Dot Catcher',icon:'ت ث',how:'Letters that look the same except for their dots fall down. Catch only the one called. Most catches in 60 seconds wins.'},
 tug:{name:'Tug of War',icon:'〰',how:'Answer letter questions. Every right answer pulls the rope toward you. Pull it all the way to win.'}
};
const HLEV=['Even','Harder','Much harder','Super hard'];
function duelPick(){
  const pool=learned(ui.kid),opps=['Daddy','Ummi',...Object.keys(S.kids).filter(k=>k!==ui.kid).map(k=>S.kids[k].name)];
  const g=ui.duelGame||'slap',opp=ui.duelOpp||'Daddy';
  return `<div class="topbar"><button class="back" data-act="home">← My garden</button></div>
  <h1>Duel with ${esc(opp)}</h1>
  <p class="muted">Put the phone flat between you. ${esc(kidName())} plays from the bottom, ${esc(opp)} from the top. Letters used: ${pool.map(x=>x[0]).join(' ')}</p>
  ${roadMap((prog(ui.kid).duels||{}).won||0)}
  <section class="sect"><h2>Pick a game</h2><div class="games">${Object.entries(GAMES).map(([id,G])=>`<button class="game ${g===id?'on':''}" data-act="duelGame" data-g="${id}"><span class="gi">${G.icon}</span><h3>${G.name}</h3><span class="small muted">${G.how}</span></button>`).join('')}</div></section>
  <section class="sect"><h2>Who is playing?</h2><div class="row">${opps.map(o=>`<button class="btn ${opp===o?'rose':'ghost'} sm" data-act="duelOpp" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></section>
  <section class="sect"><h2>Grown-up challenge</h2><p class="muted small">Makes the top player's side harder: more decoy letters, faster letters, a short wait each round. Turn it up until the games are close.</p>
   <div class="row">${HLEV.map((h,i)=>`<button class="btn ${(ui.duelH??1)===i?'gold':'ghost'} sm" data-act="duelH" data-h="${i}">${h}</button>`).join('')}</div></section>
  <div class="row"><button class="btn rose" data-act="duelGo">Start ${GAMES[g].name}</button></div>`;
}
let G=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function startDuel(){
  const pool=learned(ui.kid);
  G={game:ui.duelGame||'slap',pool,poolSet:new Set(pool.map(x=>x[0])),h:ui.duelH??1,opp:ui.duelOpp||'Daddy',score:[0,0],frz:[0,0],rope:0,lock:false,over:false,timers:[],raf:0,items:[[],[]],catches:0};
  ui.screen='duel';
  app.innerHTML=`<div class="duelwrap" id="dw">
   ${[1,0].map(p=>`<div class="half ${p?'p2':'p1'}" id="h${p}"><div class="hhead"><span><img class="hv" src="img/${p?vehOf(G.opp):'brio-side'}.png" alt="">${esc(p?G.opp:kidName())}</span><span class="pts" id="s${p}">0</span></div><div class="hq" id="q${p}"></div><div class="field" id="f${p}"></div></div>${p?`<div class="mid"><button data-act="duelQuit" aria-label="Stop game">✕</button><div class="info" id="mid"></div><button data-act="duelSay" aria-label="Say it again" ${arVoice?'':'hidden'}>🔊</button></div>`:''}`).join('')}
  </div>`;
  ({slap:slapRound,dots:dotsStart,tug:tugRound})[G.game]();
}
const $=id=>document.getElementById(id);
function later(fn,ms){const t=setTimeout(fn,ms);G.timers.push(t);return t}
function setScore(p){$('s'+p).textContent=G.score[p]}
function freeze(p,ms){G.frz[p]=performance.now()+ms;$('h'+p).classList.add('frozen');later(()=>{if(performance.now()>=G.frz[p]-5)$('h'+p).classList.remove('frozen')},ms)}
const isFrozen=p=>performance.now()<G.frz[p];
function optsFor(p,correct,n){const pool=G.pool.map(x=>x[0]);let others=shuffle(pool.filter(x=>x!==correct));
  if(others.length<n-1)others=others.concat(shuffle(LETTERS.map(x=>x[0]).filter(x=>x!==correct&&!others.includes(x))));
  return shuffle([correct,...others.slice(0,n-1)])}
function gridHTML(p,opts,kind){const c=opts.length<=4?2:opts.length<=6?3:4;return `<div class="sgrid" style="--c:${c}">${opts.map(v=>`<button data-g="${kind}" data-p="${p}" data-v="${esc(v)}" class="${kind==='tugN'?'nm':''}">${esc(kind==='tugN'?LBY[v][1]:v)}</button>`).join('')}</div>`}

/* Letter Slap */
function slapRound(){
  const tg=pick(G.pool);G.target=tg[0];G.lock=false;
  $('mid').textContent='First to 7';
  for(const p of [0,1]){
    const n=p===0?(G.pool.length>=8?6:4):Math.min(4+G.h*2,12);
    $('q'+p).innerHTML=`Slap <b>${tg[1]}</b>`;
    const opts=optsFor(p,tg[0],n),f=$('f'+p);
    if(p===1&&G.h){f.innerHTML='<div class="sgrid" style="--c:1"><span class="hq muted">Get ready...</span></div>';later(()=>{if(G.target===tg[0]&&!G.over)f.innerHTML=gridHTML(1,opts,'slap')},G.h*300)}
    else f.innerHTML=gridHTML(p,opts,'slap');
  }
  speak(tg[2]);
}
function slapTap(p,v,b){
  if(G.lock||isFrozen(p))return;
  if(v===G.target){G.lock=true;b.classList.add('hit');G.score[p]++;setScore(p);if(G.score[p]>=7)return endDuel(p);later(slapRound,450)}
  else{b.classList.add('miss');freeze(p,1000)}
}

/* Dot Catcher */
function dotsStart(){
  G.fams=FAMILIES.filter(f=>f.some(x=>G.poolSet.has(x)));
  G.end=performance.now()+60000;dotsTarget();
  let last=performance.now(),spawn=[0,0];
  const loop=now=>{if(G.over)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    const left=Math.max(0,Math.ceil((G.end-now)/1000));$('mid').textContent=left+'s';
    if(left<=0)return endDuel(G.score[0]===G.score[1]?-1:G.score[0]>G.score[1]?0:1);
    for(const p of [0,1]){
      const every=p===1?Math.max(420,900-G.h*150):900;
      if(now-spawn[p]>every){spawn[p]=now;dotsSpawn(p)}
      const fh=$('f'+p).clientHeight||300,sp=(p===1?1+G.h*.3:1)*fh*.32;
      G.items[p]=G.items[p].filter(it=>{it.y+=sp*dt;if(it.y>fh+40){it.el.remove();return false}it.el.style.transform=`translateY(${it.y}px)`;return true});
    }
    G.raf=requestAnimationFrame(loop)};
  G.raf=requestAnimationFrame(loop);
}
function dotsTarget(){
  const fam=pick(G.fams),learnedIn=fam.filter(x=>G.poolSet.has(x));G.fam=fam;G.target=pick(learnedIn);
  for(const p of [0,1]){$('q'+p).innerHTML=`Catch only <span class="ar" style="display:inline">${G.target}</span> ${esc(LBY[G.target][1])}`;G.items[p].forEach(it=>it.el.remove());G.items[p]=[]}
  speak(LBY[G.target][2]);
}
function dotsSpawn(p){
  let v;if(Math.random()<.4)v=G.target;else{let d=G.fam.filter(x=>x!==G.target);if(p===1&&G.h)d=d.concat(shuffle(LETTERS.map(x=>x[0]).filter(x=>!G.fam.includes(x))).slice(0,G.h*2));v=pick(d)}
  const el=document.createElement('button');el.className='fall';el.dataset.g='dot';el.dataset.p=p;el.dataset.v=v;el.textContent=v;
  el.style.left=(12+Math.random()*76)+'%';el.style.top='-64px';$('f'+p).appendChild(el);G.items[p].push({el,y:0});
}
function dotTap(p,v,b){
  if(isFrozen(p))return;
  G.items[p]=G.items[p].filter(it=>it.el!==b);b.remove();
  if(v===G.target){G.score[p]++;setScore(p);G.catches++;if(G.catches%4===0)dotsTarget()}
  else{G.score[p]=Math.max(0,G.score[p]-1);setScore(p);freeze(p,700)}
}

/* Tug of War */
function tugRound(){
  G.lock=false;const tg=pick(G.pool),byName=Math.random()<.5;G.target=tg[0];G.byName=byName;
  $('mid').innerHTML='<div class="rope"></div>';

    const n=p===0?(G.pool.length>=6?4:3):Math.min(4+G.h*2,10);
    $('q'+p).innerHTML=byName?`Which letter is <b>${esc(tg[1])}</b>?`:`What is this letter? <span class="ar">${tg[0]}</span>`;
    const opts=optsFor(p,tg[0],n),f=$('f'+p);
    if(p===1&&G.h){f.innerHTML='';later(()=>{if(G.target===tg[0]&&!G.over)f.innerHTML=gridHTML(1,opts,byName?'tug':'tugN')},G.h*300)}
    else f.innerHTML=gridHTML(p,opts,byName?'tug':'tugN');
  }
  if(byName)speak(tg[2]);

function tugTap(p,v,b){
  if(G.lock||isFrozen(p))return;
  if(v===G.target){G.lock=true;b.classList.add('hit');G.rope+=p===0?1:-1;G.score[p]++;setScore(p);
    const r=G.rope;$('dw').style.gridTemplateRows=`${50+r*7}fr auto ${50-r*7}fr`;
    if(Math.abs(r)>=5)return endDuel(r>0?0:1);later(tugRound,450)}
  else{b.classList.add('miss');freeze(p,1000)}
}

function stopDuel(){if(!G)return;G.over=true;cancelAnimationFrame(G.raf);G.timers.forEach(clearTimeout)}

  return `<div class="topbar"><button class="back" data-act="cover">← Done</button>${saveChip()}</div>
  <div class="ph"><img src="img/quran.jpg" alt=""><div><h1>Parents' corner</h1><p class="muted">Approve lessons, confirm good deeds and see how everyone is doing.</p></div></div>

  <section class="sect"><div class="spread"><h2>Children</h2><button class="btn sm" data-act="editKid" data-id="new">Add a child</button></div>
   ${ek?`<div class="card stage"><h3>${ek==='new'?'Add a child':'Edit '+esc(kid.name)}</h3>
     <div class="field"><label for="kname">Name</label><input id="kname" value="${esc(kid.name)}" autocomplete="off"></div>
     <div class="field"><label for="kpin">4-number PIN (leave empty for no PIN)</label><input id="kpin" inputmode="numeric" maxlength="4" value="${esc(kid.pin||'')}" autocomplete="off"></div>
     <div class="field"><label>Symbol</label><div class="syms">${SYMS.map(s=>`<button class="${(ui.sym||kid.symbol)===s?'on':''}" data-act="sym" data-s="${s}" aria-label="Symbol ${s}">${s}</button>`).join('')}</div></div>
     <div class="row"><button class="btn rose" data-act="saveKid">Save</button><button class="btn ghost" data-act="editKid" data-id="">Cancel</button>${ek!=='new'?`<button class="btn ghost" data-act="delKid">Remove</button>`:''}</div></div>`:''}
   <div class="list">${ids.length?ids.map(k=>`<div class="li">${symEl(k,40)}<span class="tx"><b>${esc(S.kids[k].name)}</b><span class="small muted" style="display:block">${S.kids[k].pin?'Has a PIN':'No PIN'}</span></span><button class="btn ghost sm" data-act="editKid" data-id="${k}">Edit</button></div>`).join(''):'<p class="muted">No children yet. Add the first one.</p>'}</div>
  </section>

  <section class="sect"><h2>Waiting for your OK</h2><p class="muted small">Read each lesson before your children see it. Arabic letters are open already.</p>
   ${worlds.map(({w,list})=>{const pend=list.filter(l=>!approved(l));return `<div class="card stage"><div class="spread"><h3>${WORLDS[w].name}</h3>${pend.length?`<button class="btn sm" data-act="apprAll" data-w="${w}">Approve all ${pend.length}</button>`:'<span class="chip green">All approved</span>'}</div>
    <div class="list">${list.map(l=>`<div class="li"><span class="tx"><b>${esc(l.title)}</b></span>${approved(l)?'<span class="chip green">Approved</span>':`<button class="btn sm" data-act="appr" data-id="${l.id}">Approve</button>`}<button class="btn ghost sm" data-act="prev" data-id="${l.id}">${ui.openPrev===l.id?'Hide':'Read'}</button>${ui.openPrev===l.id?previewHTML(l):''}</div>`).join('')}</div></div>`}).join('')}
  </section>

  <section class="sect"><h2>Good deeds</h2>
   <div class="list">${pendingDeeds.length?pendingDeeds.map(([i,d])=>`<div class="li"><span class="tx"><b>${esc(S.kids[d.kid]?.name||'')}</b>: ${esc(d.text)}</span><button class="btn sm" data-act="deedOk" data-id="${i}">Yes, MashaAllah</button><button class="btn ghost sm" data-act="deedNo" data-id="${i}">Not this time</button></div>`).join(''):'<p class="muted">Nothing waiting.</p>'}</div>
   ${ids.length?`<div class="card stage"><h3>Add a deed you saw</h3><div class="field"><label for="dkid">Child</label><select id="dkid">${ids.map(k=>`<option value="${k}">${esc(S.kids[k].name)}</option>`).join('')}</select></div><div class="field"><label for="dtext">What did they do?</label><input id="dtext" placeholder="Helped clear the table without being asked" autocomplete="off"></div><div class="row"><button class="btn rose" data-act="addDeed">Add and grow a flower</button></div></div>`:''}
  </section>

  <section class="sect"><h2>Progress</h2>${ids.length?`<div class="card tablewrap"><table><thead><tr><th>Child</th><th>Knowing Allah</th><th>Duas</th><th>Letters</th><th>Stars</th><th>Streak</th><th>Last active</th></tr></thead><tbody>
   ${ids.map(k=>{const P=prog(k);const c=w=>WORLDS[w].lessons.filter(l=>P.done[l.id]).length+'/'+WORLDS[w].lessons.length;const last=(P.log||[]).slice(-1)[0];return `<tr><td><b>${esc(S.kids[k].name)}</b></td><td>${c('aq')}</td><td>${c('ad')}</td><td>${c('ar')}</td><td>${Object.values(P.done).reduce((a,b)=>a+b,0)}</td><td>${P.streak||0}</td><td>${last?new Date(last.at).toLocaleDateString():'Not yet'}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">Progress appears once children start.</p>'}</section>

  <section class="sect"><h2>For you to read</h2><div class="list">
   <div class="li"><span class="tx"><a href="https://abdurrahman.org/2014/06/04/how-does-a-father-teach-his-children-tawheed-shaykh-muhammad-bin-salih-al-uthaymeen/" target="_blank" rel="noopener">How does a father teach his children Tawheed?</a><span class="small muted" style="display:block">Shaykh al-Uthaymeen</span></span></div>
   <div class="li"><span class="tx"><a href="https://abdurrahman.org/2015/02/10/tawheed-for-children-dr-saleh-as-saleh/" target="_blank" rel="noopener">Tawheed for Children, Levels One and Two</a><span class="small muted" style="display:block">Dr. Saleh as-Saleh. Source of the Knowing Allah lessons</span></span></div>
   <div class="li"><span class="tx"><a href="https://abdurrahman.org/hisn-al-muslim/" target="_blank" rel="noopener">Hisn al-Muslim</a><span class="small muted" style="display:block">Source checks for the daily duas</span></span></div>
  </div></section>

  ${fb&&fb.state==='in'?`<section class="sect"><h2>Family access</h2><p class="muted small">Signed in as ${esc(fbEmail())}. Grown-ups on this list can sign in with Google on their own devices and see everyone's progress.</p>
   <div class="list">${OWNERS.map(e=>`<div class="li"><span class="tx">${esc(e)}</span><span class="chip gold">Owner</span></div>`).join('')}${(S.access||[]).map(e=>`<div class="li"><span class="tx">${esc(e)}</span>${isOwner()?`<button class="btn ghost sm" data-act="rmMember" data-e="${esc(e)}">Remove</button>`:''}</div>`).join('')}</div>
   ${isOwner()&&(fb.requests||[]).length?`<div class="card stage"><h3>Waiting to join</h3><div class="list">${fb.requests.map(r=>`<div class="li"><span class="tx"><b>${esc(r.name||'Someone')}</b><span class="small muted" style="display:block">${esc(r.email)}</span></span><button class="btn sm" data-act="approveJoin" data-u="${esc(r.uid)}">Approve</button><button class="btn ghost sm" data-act="declineJoin" data-u="${esc(r.uid)}">Decline</button></div>`).join('')}</div></div>`:''}
   ${isOwner()?`<div class="card stage"><div class="field"><label for="newmember">Add a parent's Google email</label><input id="newmember" type="email" autocomplete="off" placeholder="name@gmail.com"></div><div class="row"><button class="btn sm" data-act="addMember">Add to family</button></div></div>`:''}
   <div class="row"><button class="btn ghost sm" data-act="fbSignOut">Sign out of Google on this device</button></div></section>`:''}
  <section class="sect"><h2>Settings</h2><div class="card stage"><div class="field"><label for="ppin2">Change parent PIN</label><input id="ppin2" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="New 4-number PIN"></div><div class="row"><button class="btn ghost sm" data-act="changePin">Update PIN</button></div>
   <p class="small muted">${mode==='db'?(fb?'Progress syncs through the family database, so it follows each child to every device where a family grown-up has signed in.':'Progress is saved to your family space, so it follows each child across devices where a signed-in grown-up opens this page.'):'Progress is saved on this device only. Open this page while signed in to save it to your family space.'}</p></div></section>`;
}
function previewHTML(l){
  if(l.world==='ad')return `<div class="preview"><div class="ar" style="font-size:1.4rem">${l.ar}</div><div><i>${esc(l.tr)}</i></div><div>${esc(l.mean)}</div>${l.extra?`<div class="ar" style="font-size:1.2rem">${l.extra.ar}</div><div>${esc(l.extra.mean)}</div>`:''}<div class="small muted">When: ${esc(l.when)} · Source: ${esc(l.src)}</div></div>`;
  return `<div class="preview">${l.steps.map(s=>s.t==='say'||s.t==='key'||s.t==='daddy'?`<div>${s.t==='key'?'<b>Remember:</b> ':''}${esc(s.text)}</div>`:s.t==='quiz'?s.qs.map(q=>`<div class="small">Q: ${esc(q.q)} <b>${esc(q.o[0])}</b></div>`).join(''):s.t==='sort'?`<div class="small">Sort: ${s.items.map(i=>esc(i[0])+(i[1]?' ✓':' ✗')).join(' · ')}</div>`:s.t==='match'?`<div class="small">Match: ${s.pairs.map(p=>esc(p[1])+' = '+esc(p[2])).join(' · ')}</div>`:s.t==='tap'?`<div class="small">Tap game: ${s.items.map(i=>esc(i[1])).join(', ')}</div>`:'').join('')}</div>`;
}

/* ===================== EVENTS ===================== */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;
  const L=ui.L,st=L&&L.st,s=L&&curStep();
  switch(a){
   case 'cover':ui.parent=false;ui.editKid=null;go('cover');break;
   case 'fbSignIn':{const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});fb.auth.signInWithPopup(pr).catch(e=>{if(e&&/popup-blocked|operation-not-supported/.test(e.code||''))fb.auth.signInWithRedirect(pr);else if(!/popup-closed|cancelled/.test(e.code||''))toast('Sign-in did not finish. Please try again.')});break;}
   case 'fbSignOut':fb.auth.signOut().then(()=>location.reload());break;
   case 'fbRequest':{const u=fb.user;fb.fs.doc('requests/'+u.uid).set({email:fbEmail(),name:u.displayName||'',at:Date.now()}).then(()=>{fb.req='sent';render()}).catch(()=>toast('Could not send the request. Please try again.'));break;}
   case 'approveJoin':{const r=(fb.requests||[]).find(x=>x.uid===b.dataset.u);if(!r)break;let w=Promise.resolve();if(!S.access.includes(r.email)&&!OWNERS.includes(r.email)){S.access=[...S.access,r.email];w=put('fam/access',{members:S.access})}w.then(()=>fb.fs.doc('requests/'+r.uid).delete()).catch(()=>{});toast('Approved. Their screen will open in a moment.');break;}
   case 'declineJoin':fb.fs.doc('requests/'+b.dataset.u).delete().catch(()=>{});break;
   case 'addMember':{const v=(document.getElementById('newmember').value||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('Enter a full email address');break}if(OWNERS.includes(v)||S.access.includes(v)){toast('Already on the list');break}S.access=[...S.access,v];put('fam/access',{members:S.access});toast('Added. They can sign in now.');render();break;}
   case 'rmMember':S.access=S.access.filter(x=>x!==b.dataset.e);put('fam/access',{members:S.access});render();break;
   case 'setup':go(S.settings.parentPin?'parents':'setup');break;
   case 'parentLogin':if(!S.settings.parentPin)go('setup');else go('pin',{pin:'',pinFor:'parent'});break;
   case 'pickKid':if(!S.kids[id].pin){ui.kid=id;go('home')}else go('pin',{pin:'',pinFor:id});break;
   case 'pinBack':go(ui.pinFor==='daddyCheck'?'play':ui.pinFor==='duelUnlock'?'home':'cover');break;
   case 'duelUnlock':go('pin',{pin:'',pinFor:'duelUnlock'});break;
   case 'duelPick':go('duelpick');break;
   case 'duelGame':ui.duelGame=b.dataset.g;render();break;
   case 'duelOpp':ui.duelOpp=b.dataset.o;ui.duelH=b.dataset.o==='Daddy'||b.dataset.o==='Ummi'?(ui.duelH||1):0;render();break;
   case 'duelH':ui.duelH=+b.dataset.h;render();break;
   case 'duelGo':startDuel();break;
   case 'duelQuit':stopDuel();go('duelpick');break;
   case 'duelSay':if(G&&G.target)speak(LBY[G.target][2]);break;
   case 'key':{const k=b.dataset.k;if(k==='⌫')ui.pin=ui.pin.slice(0,-1);else if(ui.pin.length<4)ui.pin+=k;
     if(ui.pin.length===4){const want=['parent','daddyCheck','duelUnlock'].includes(ui.pinFor)?S.settings.parentPin:S.kids[ui.pinFor]?.pin;
       if(ui.pin===want){if(ui.pinFor==='parent'){ui.parent=true;go('parents')}else if(ui.pinFor==='duelUnlock'){ui.duelUnlocked=true;go('duelpick')}else if(ui.pinFor==='daddyCheck'){toast("Daddy's star!");ui.screen='play';finishLesson()}else{ui.kid=ui.pinFor;go('home')}}
       else{ui.pin='';render();const p=document.getElementById('pinbox');p&&p.classList.add('shake');toast('Try again')}}
     else render();break;}
   case 'logout':ui.kid=null;go('cover');break;
   case 'home':go('home');break;
   case 'world':go('world',{world:b.dataset.w});break;
   case 'open':startLesson(id);break;
   case 'quit':go(ui.world?'world':'home');break;
   case 'quick':{const q=L.steps.filter(x=>x.t==='quiz');const extra=L.steps.filter(x=>x.t==='daddy');L.steps=[...q,...extra];L.i=0;L.quick=true;L.miss=0;prepStep();render();break;}
   case 'next':if(L.i<L.steps.length-1){L.i++;prepStep();render();window.scrollTo({top:0})}else finishLesson();break;
   case 'tap':st.open[b.dataset.i]=1;render();break;
   case 'letter':{st.open[b.dataset.i]=1;const x=s.set[b.dataset.i];speak(x[2]);render();break;}
   case 'sort':{const it=st.items[st.k];st.ans=(+b.dataset.v===it[1]);if(!st.ans)L.miss++;render();break;}
   case 'sortNext':st.k++;st.ans=null;render();break;
   case 'mL':st.sel=+b.dataset.i;render();break;
   case 'mR':{if(st.sel==null){toast('Tap a name on the left first');break}const r=+b.dataset.i;if(r===st.sel){st.done[r]=1;st.sel=null}else{L.miss++;toast('Not a match. Try again');st.sel=null}render();break;}
   case 'ans':{const q=s.qs[st.q];st.ans=b.dataset.v;if(st.ans!==q.o[0])L.miss++;else if(q.big||q.glyph){const x=LETTERS.find(y=>y[1]===q.o[0]||y[0]===q.o[0]);x&&speak(x[2])}render();break;}
   case 'qNext':st.q++;st.ans=null;if(st.q>=s.qs.length){if(L.i<L.steps.length-1){L.i++;prepStep()}else{finishLesson();break}}render();break;
   case 'count':st.c++;render();break;
   case 'chunk':{const i=+b.dataset.i;if(i===st.placed.length)st.placed.push(i);else{L.miss+=0;toast('Which piece comes first?');b.classList.add('shake');break}render();break;}
   case 'daddyCheck':go('pin',{pin:'',pinFor:'daddyCheck'});break;
   case 'deed':{const k=uid();S.deeds[k]={kid:ui.kid,text:b.dataset.t,status:'pending',at:Date.now()};saveDeed(k);toast('Sent to Daddy');render();break;}
   case 'savePin':{const v=document.getElementById('ppin').value.trim();if(!/^\d{4}$/.test(v)){toast('Use exactly 4 numbers');break}S.settings.parentPin=v;saveSettings();ui.parent=true;ui.editKid='new';go('parents');break;}
   case 'changePin':{const v=document.getElementById('ppin2').value.trim();if(!/^\d{4}$/.test(v)){toast('Use exactly 4 numbers');break}S.settings.parentPin=v;saveSettings();toast('PIN updated');render();break;}
   case 'editKid':ui.editKid=id||null;ui.sym=null;render();break;
   case 'sym':ui.sym=b.dataset.s;{const n=document.getElementById('kname')?.value,p=document.getElementById('kpin')?.value;render();if(n!=null)document.getElementById('kname').value=n;if(p!=null)document.getElementById('kpin').value=p;}break;
   case 'saveKid':{const n=document.getElementById('kname').value.trim(),p=document.getElementById('kpin').value.trim();if(!n){toast('Add a name');break}if(p&&!/^\d{4}$/.test(p)){toast('PIN must be 4 numbers, or empty');break}
     const k=ui.editKid==='new'?uid():ui.editKid;S.kids[k]=Object.assign({},S.kids[k]||{},{name:n,pin:p,symbol:ui.sym||S.kids[k]?.symbol||'🌸'});saveKid(k);if(!S.progress[k]){prog(k);saveProg(k)}ui.editKid=null;toast('Saved');render();break;}
   case 'delKid':{const k=ui.editKid;delete S.kids[k];del('kids/'+k);ui.editKid=null;toast('Removed');render();break;}
   case 'appr':S.approvals[id]=true;saveApprovals();render();break;
   case 'apprAll':WORLDS[b.dataset.w].lessons.forEach(l=>S.approvals[l.id]=true);saveApprovals();toast('Approved');render();break;
   case 'prev':ui.openPrev=ui.openPrev===id?null:id;render();break;
   case 'deedOk':S.deeds[id].status='ok';saveDeed(id);toast('A flower grew');render();break;
   case 'deedNo':delete S.deeds[id];del('deeds/'+id);render();break;
   case 'addDeed':{const kid=document.getElementById('dkid').value,t=document.getElementById('dtext').value.trim();if(!t){toast('Write the good deed');break}const k=uid();S.deeds[k]={kid,text:t,status:'ok',at:Date.now()};saveDeed(k);toast('A flower grew');render();break;}
  }
});
render();
</script>

</body>
</html>
