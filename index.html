<title>Little Lantern</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one column "garden path"; cover, kid home with garden strip + world map, focused lesson card, score card, parents' corner */
:root{
  --bg:#FBF4F2; --surface:#FFFFFF; --ink:#2B2430; --muted:#6F6370; --line:#EBDCDE;
  --rose:#B9587A; --rose-soft:#F6DFE7; --green:#1F5C4A; --green-soft:#DCEDE5;
  --gold:#C98F22; --gold-soft:#FBEFD3; --sky:#E8EEF8; --bad:#B4462F; --bad-soft:#F8E1DA;
  --f-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1920; --surface:#26232C; --ink:#F3ECEF; --muted:#B7ABB4; --line:#3A3441;
  --rose:#E991AE; --rose-soft:#47293A; --green:#74C8A6; --green-soft:#1D3A31;
  --gold:#EBC06A; --gold-soft:#3E3220; --sky:#252B38; --bad:#F09A82; --bad-soft:#47271F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1920; --surface:#26232C; --ink:#F3ECEF; --muted:#B7ABB4; --line:#3A3441;
  --rose:#E991AE; --rose-soft:#47293A; --green:#74C8A6; --green-soft:#1D3A31;
  --gold:#EBC06A; --gold-soft:#3E3220; --sky:#252B38; --bad:#F09A82; --bad-soft:#47271F; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:760px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.ar{font-family:var(--f-ar);direction:rtl;line-height:1.9}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
a{color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;
  font-family:var(--f-display);font-weight:600;font-size:1.05rem;background:var(--green);color:var(--bg);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.rose{background:var(--rose)} .btn.gold{background:var(--gold);color:#2B2430}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.92rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--r);padding:18px;border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:700;letter-spacing:.02em}
.chip.green{background:var(--green-soft);color:var(--green)} .chip.rose{background:var(--rose-soft);color:var(--rose)}
.chip.gold{background:var(--gold-soft);color:var(--gold)} .chip.plain{background:var(--sky);color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);min-height:44px}

/* cover */
.cover{display:grid;gap:18px}
.cover-art{border-radius:24px;overflow:hidden;aspect-ratio:2/1;max-width:100%;background:var(--gold-soft)}
.cover-art img{width:100%;height:100%;object-fit:cover;object-position:50% 70%;display:block}
.us{width:min(220px,54%);margin:-90px auto 0;border-radius:24px;overflow:hidden;border:5px solid var(--surface);box-shadow:0 12px 30px rgba(43,36,48,.22);position:relative}
.us img{display:block;width:100%}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .bism{font-family:var(--f-ar);font-size:1.5rem;color:var(--green);direction:rtl}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.kidtile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line)}
.kidtile:hover{border-color:var(--rose)}
.sym{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:2rem}
.kidtile b{font-family:var(--f-display);font-weight:600;font-size:1.15rem}

/* pin */
.pin{display:grid;gap:18px;justify-items:center;text-align:center}
.dots{display:flex;gap:14px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--rose)}
.dots i.on{background:var(--rose)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.shake{animation:shake .35s}
.isl{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#14233F 0%,#1B3A4E 55%,#1F5C4A 100%);color:#fff}
.isl .sky{position:absolute;inset:0;width:100%;height:100%}
.isl-head{position:relative;padding:18px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.isl-head h1{color:#FBEFD3;font-size:1.7rem}
.isl-head p{margin:2px 0 0;color:#CFE0E6;font-size:.85rem}
.isl-prog{flex:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.85rem;color:#FBEFD3}
.isl-map{position:relative}
.isl-map svg.trail{position:absolute;left:0;top:0;width:100%}
.stop{position:absolute;transform:translate(-50%,-42px);display:flex;flex-direction:column;align-items:center;width:172px;background:none;border:0;padding:0;color:#fff;font:inherit;cursor:pointer}
.stop .orb{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;background:radial-gradient(circle at 35% 30%,#FFF7E0,#F2C46B 55%,#C98F22);box-shadow:0 0 0 5px rgba(251,239,211,.25),0 8px 18px rgba(0,0,0,.35)}
.stop.todo .orb{background:radial-gradient(circle at 35% 30%,#ffffff,#DCEDE5 60%,#9CC9B6)}
.stop.now .orb{animation:glow 1.6s ease-in-out infinite alternate}
.stop.lock .orb{background:#34465A;filter:grayscale(.85);font-size:1.8rem;box-shadow:0 0 0 5px rgba(255,255,255,.08)}
.stop.lock{cursor:default}
.stop .n{position:absolute;left:-4px;top:-4px;width:28px;height:28px;border-radius:50%;background:#B9587A;color:#fff;font:700 .85rem var(--f-display);display:grid;place-items:center;border:2px solid #fff}
.stop .txt{margin-top:8px;max-width:172px;display:flex;flex-direction:column;align-items:center;padding:4px 12px 6px;border-radius:14px;background:rgba(12,22,38,.72);backdrop-filter:blur(2px)}
.stop .lab{font:600 1rem/1.15 var(--f-display);text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.stop .arl{font-family:var(--f-ar);font-size:1.15rem;color:#F6D58E;line-height:1.3;direction:rtl}
.stop .st{color:#F6D365;font-size:.95rem;letter-spacing:2px}
.stop .tag{margin-top:2px;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:#B9587A}
.stop .tag.wait{background:#C98F22}
.stop .me{position:absolute;right:-6px;top:-14px;border-radius:50%;box-shadow:0 0 0 3px #fff;animation:hop 1.2s ease-in-out infinite alternate}
.isl-foot{position:relative;text-align:center;padding:0 16px 18px;color:#CFE0E6;font-size:.85rem}
@keyframes glow{from{box-shadow:0 0 0 5px rgba(251,239,211,.25),0 0 10px 2px rgba(246,213,142,.4)}to{box-shadow:0 0 0 9px rgba(251,239,211,.35),0 0 28px 8px rgba(246,213,142,.75)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.stop.now .orb,.stop .me{animation:none}}
.letter .pw{display:flex;align-items:center;gap:6px;margin-top:2px}
.letter .pe{font-size:1.8rem;line-height:1}
.letter .pa{font-family:var(--f-ar);font-size:1.3rem;color:var(--ink)}
.dban{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:var(--rose-soft);color:var(--ink)}
.dban .dbe{font-size:2.6rem;line-height:1}
.dban b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.dday{display:flex;flex-direction:column;gap:12px}
.dsec{border-radius:22px;padding:12px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.dsec .dh{display:flex;align-items:center;gap:8px;font-size:1.2rem;color:#2B2430;margin:0 0 10px 4px}
.dsec .dh span{font-size:1.6rem}
.dsec.night .dh{color:#FBEFD3}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dcard{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border-radius:18px;background:#fff;border:0;color:#2B2430;font:inherit;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.08);cursor:pointer}
.dcard .dpic{font-size:2.8rem;line-height:1.1}
.dcard b{font-family:var(--f-display);font-weight:600;font-size:.98rem;line-height:1.15}
.dcard .dar{font-family:var(--f-ar);font-size:1.15rem;color:#B9587A;direction:rtl;line-height:1.5}
.lland{display:flex;flex-direction:column;gap:12px}
.lset{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:20px;background:var(--surface);border:2px solid var(--line);border-left:8px solid var(--h);font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.lset.off{opacity:.55;cursor:default}
.lsn{font-family:var(--f-display);font-weight:600;color:var(--h)}
.lrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:rtl}
.lt{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:14px;background:color-mix(in srgb,var(--h) 10%,var(--surface))}
.lt .lg{font-family:var(--f-ar);font-size:2.2rem;line-height:1.35;color:var(--h)}
.lt .le{font-size:1.5rem;line-height:1}
.lt small{font-size:.72rem;color:var(--muted);direction:ltr}
.bell{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--gold);background:var(--gold-soft);color:var(--ink);font:inherit;cursor:pointer;width:100%}
.bell .ic{font-size:1.8rem}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* kid home */
.hello{display:flex;align-items:center;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.garden{border-radius:var(--r);overflow:hidden;background:linear-gradient(var(--sky),var(--green-soft));border:1px solid var(--line)}
.garden svg{display:block;width:100%;height:auto}
.garden-cap{padding:8px 14px 12px;font-size:.88rem;color:var(--muted)}
.today{display:grid;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.task .tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800}
.task.done .tick{background:var(--green);border-color:var(--green);color:var(--bg)}
.task .tx{flex:1;min-width:0}
.task .tx small{display:block;color:var(--muted)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.world{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r);text-align:left;border:2px solid transparent;min-height:150px}
.world .wicon{font-size:1.9rem}
.world h3{font-size:1.2rem}
.world .bar{height:8px;border-radius:9px;background:rgba(127,127,127,.18);overflow:hidden;margin-top:auto}
.world .bar i{display:block;height:100%;background:currentColor}
.w-aq{background:var(--green-soft);color:var(--green)} .w-sk{background:var(--gold-soft);color:var(--ink)} .w-st{background:var(--sky);color:var(--ink)} .w-ad{background:var(--rose-soft);color:var(--rose)} .w-ar{background:var(--gold-soft);color:var(--gold)}
.world p{color:var(--ink);font-size:.92rem}
.world.locked{background:var(--surface);border:2px dashed var(--line);color:var(--muted);cursor:default}
.lantern{display:flex;gap:16px;align-items:center}
.lantern svg{flex:none}

/* world list */
.lessons{display:grid;gap:10px}
.lesson{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.lesson .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none;font-size:1.1rem}
.lesson .tx{flex:1;min-width:0}
.lesson .ar{font-size:1.25rem;color:var(--green)}
.lesson.off{opacity:.6;cursor:default}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05rem;white-space:nowrap}

/* player */
.prog{height:10px;border-radius:9px;background:var(--line);overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--rose);transition:width .3s}
.stage{display:grid;gap:16px}
.daddy{display:flex;gap:10px;align-items:center;font-weight:800;color:var(--gold);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.say{font-size:1.3rem;line-height:1.55;font-weight:600}
.bigar{font-family:var(--f-ar);font-size:2.4rem;color:var(--green);direction:rtl;text-align:center;line-height:1.8}
.tr{font-style:italic;color:var(--muted);text-align:center}
.key{background:var(--gold-soft);border:2px solid var(--gold);border-radius:var(--r);padding:18px}
.key .lbl{font-weight:800;color:var(--gold);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
.key p{font-size:1.2rem;font-weight:700;margin-top:6px}
.taps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tapit{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;background:var(--surface);border:2px solid var(--line);min-height:120px;text-align:center}
.tapit .ic{font-size:2.2rem}
.tapit.open{border-color:var(--green);background:var(--green-soft)}
.tapit .rev{font-size:.85rem;font-weight:800;color:var(--green)}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);text-align:left;font-weight:700;font-size:1.08rem;min-height:56px}
.opt.glyph{font-family:var(--f-ar);font-size:2.2rem;text-align:center;padding:4px}
.opts.grid4{grid-template-columns:repeat(2,1fr)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:12px 14px;border-radius:14px;font-weight:700}
.fb.ok{background:var(--green-soft);color:var(--green)} .fb.no{background:var(--bad-soft);color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{padding:10px;border-radius:14px;background:var(--surface);border:2px solid var(--line);min-height:56px;font-weight:700;font-size:.95rem}
.mi .ar{font-size:1.3rem;display:block;color:var(--green)}
.mi.sel{border-color:var(--gold);background:var(--gold-soft)}
.mi.done{border-color:var(--green);background:var(--green-soft);opacity:.55}
.sortcard{text-align:center;font-size:1.3rem;font-weight:700;padding:26px 18px}
.counter{display:grid;place-items:center;gap:10px}
.counter button{width:120px;height:120px;border-radius:50%;background:var(--rose-soft);border:3px solid var(--rose);font-family:var(--f-display);font-size:2.4rem;font-weight:700;color:var(--rose)}
.built{min-height:64px;padding:10px;border-radius:16px;border:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:flex-start}
.chunks{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center}
.chunk{font-family:var(--f-ar);font-size:1.45rem;padding:4px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.chunk.placed{background:var(--green-soft);border-color:var(--green)}
.letters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.letter{display:grid;justify-items:center;gap:2px;padding:12px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.letter .g{font-family:var(--f-ar);font-size:3.4rem;line-height:1.3;color:var(--green)}
.letter.open{border-color:var(--gold);background:var(--gold-soft)}
.src{font-size:.8rem;color:var(--muted)}

/* stories */
.story{display:grid;gap:12px;touch-action:pan-y}
.scene{border-radius:var(--r);overflow:hidden;aspect-ratio:5/3;max-width:100%;background:var(--sky)}
.scene svg{display:block;width:100%;height:100%}
.ayah{background:var(--green-soft);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.ayah .ar{font-size:1.55rem;color:var(--green);text-align:center}

AD.forEach(d=>{d.world='ad';d.auto=true;d.sub=d.when;d.steps=adhkarSteps(d)});
function adhkarSteps(d){
  const others=['🍽️ Before you start eating','🌅 When you wake up','🛏️ When you lie down to sleep','👟 When you go out of the house','😋 When you finish eating','🧼 When you come out of the toilet','🤧 When you sneeze','🛡️ Every morning and evening'];
  const st=[{t:'say',text:`Here is a dua for: ${d.when.toLowerCase()}. Listen to Daddy say it, then say it with him.`},
    {t:'dhikr'},{t:'count',n:d.count||3}];
  if(d.chunks) st.push({t:'order',chunks:d.chunks});
  st.push({t:'quiz',qs:[{q:'When do we say this dua?',o:[DPIC[d.id]+' '+d.when.split('.')[0],...shuffle(others.filter(x=>!x.startsWith(DPIC[d.id])&&!d.when.toLowerCase().startsWith(x.slice(x.indexOf(' ')+1).toLowerCase().slice(0,12)))).slice(0,2)],why:d.when},
    {q:'What does it mean?',o:[d.mean,...shuffle(AD.filter(x=>x.id!==d.id).map(x=>x.mean)).slice(0,2)],why:d.mean}]});
  return st;
}

 {sc:{label:'A calm night with a soft light',sky:NIGHT,stars:true,glow:[200,90],dunes:NIGHTD},text:"They did not blame anyone else. They turned to Allah and made this dua. We can say it too.",ay:AY2.rabbana},

 {sc:{label:'A glowing lantern beside an open Qur\'an',sky:NIGHT,stars:true,lantern:[90,104],book:true,dunes:NIGHTD},text:"What do we learn? Pride made Iblis lose everything. When we make a mistake, we say sorry to Allah like Adam did, and Allah forgives us."}],
 quiz:[{q:'What was Adam created from?',o:['Clay','Fire','Light'],why:'Allah created Adam from clay.'},
  {q:'Who refused to obey Allah and bow?',o:['Iblis','The angels','Hawwa'],why:'Iblis refused because he was proud.'},
  {q:'What made Iblis disobey?',o:['Pride','Hunger','He was tired'],why:'He thought he was better. That is pride.'},
  {q:'What did Adam and Hawwa do after their mistake?',o:['They said sorry to Allah','They blamed Shaytan','They hid'],why:'They said: Rabbana zalamna anfusana, and Allah forgave them.'}]},
{id:'st-nuh',pid:'nuh',title:'Prophet Nuh and the ark',ar:'نُوح عَلَيْهِ السَّلَام',sub:'Patience, and Bismillah when we set off',slides:[
 {sc:{label:'A quiet town in the evening',sky:['#C7A0B8','#F1D9CF'],town:{},dunes:['#B9A78E','#A8957B','#97836A']},text:"Long after Adam, people slowly forgot Allah. They began worshipping statues instead of Him."},
 {sc:{label:'A glowing lantern in the night',sky:NIGHT,stars:true,moon:true,lantern:[200,118],dunes:NIGHTD},text:"So Allah sent Prophet Nuh, alayhis salaam, to call them back to Allah.",ay:AY2.nadhir},
 {sc:{label:'Sun and moon together over the town',sky:['#5E6F9C','#E8B98E'],sun:[300,70,20],moon:[90,60,16],town:{lit:true},dunes:['#B9A78E','#A8957B','#97836A']},text:"Nuh called them by day and by night, quietly and openly, for nine hundred and fifty years!",ay:AY2.alf},
 {sc:{label:'Rain clouds over green land',sky:['#9CC3DE','#E3F0F7'],cloud:[110,40,1.1,'#F4F7FA'],rain:true,dunes:['#A9C98A','#8DB873','#76A35E']},text:"He told them that Allah would forgive them and send them rain, if only they would ask.",ay:AY2.ghaffar},
 {sc:{label:'A big wooden ship being built on dry land',sky:['#F3D3A6','#FBEAD2'],sun:[330,60,20],ark:[200,160,1],dunes:['#E4B57B','#D8A464','#C99252']},text:"Only a few people believed. Allah told Nuh to build a huge ship, called the ark, on dry land.",ay:AY2.fulk},
 {sc:{label:'The ark on dry land under a plain sky',sky:['#C9B79C','#EADFCB'],ark:[200,160,1],dunes:['#D9A05E','#C98B4A','#B87A3D']},text:"Every time the leaders walked past, they laughed at him. Nuh kept building, patient and sure of Allah's promise.",ay:AY2.sakhiru},
 {sc:{label:'Rain pouring over the ark',sky:['#5E6472','#A3A9B5'],cloud:[60,20,1.6,'#4A4F5C'],rain:true,ark:[200,170,1],dunes:['#8A8F9A','#7A7F8A','#6A6F7A']},text:"Then water came pouring from the sky and gushing from the earth. Allah told Nuh to carry the believers and a pair of every kind of animal.",ay:AY2.zawjain},
 {sc:{label:'The ark sailing on big waves',sky:['#4E5666','#8E96A6'],ark:[200,168,1],sea:['#3F6E8E','#2F5670'],rain:true,cloud:[200,20,1.2,'#4A4F5C']},text:"As the ark set off, Nuh said: Bismillah. We can say this too when we start a journey.",ay:AY2.majraha},
 {sc:{label:'Huge waves under a dark sky',sky:['#3B4250','#6E7686'],sea:['#335C78','#244660'],noGround:true},text:"Even one of Nuh's sons refused to come aboard. He thought a mountain would keep him safe. But only Allah's mercy could save anyone that day, and the waves came between them.",ay:AY2.laasim},
 {sc:{label:'The ark resting on a mountain under a clear sky',sky:['#9FD0EE','#E6F4FB'],sun:[330,50,18],peak:'#7E9A7A',ark:[200,82,.55],sea:['#6FA7C8','#5A92B4']},text:"At last the water went down, and the ark came to rest on the mountain of al-Judi. Nuh and the believers stepped out onto a fresh, clean earth.",ay:AY2.judi},
 {sc:{label:'A glowing lantern beside an open Qur\'an',sky:NIGHT,stars:true,lantern:[90,104],book:true,dunes:NIGHTD},text:"What do we learn? Keep doing what is right, even when others laugh. Be patient like Nuh. Say Bismillah when you set off. And only Allah can truly keep us safe."}],
 quiz:[{q:'How long did Nuh call his people to Allah?',o:['950 years','10 years','100 days'],why:'A thousand years less fifty: 950 years.'},
  {q:'What did Allah tell Nuh to build?',o:['A huge ship, the ark','A tall tower','A big wall'],why:'Allah told him to build the ark.'},
  {q:'What did Nuh say as the ark set off?',o:['Bismillah','Goodbye','Hurry up'],why:'Bismillahi majraha wa mursaha.'},
  {q:'Where did the ark come to rest?',o:['On the mountain al-Judi','In the desert','On an island'],why:'It came to rest on al-Judi.'}]},
{id:'st-saaleh',pid:'saaleh',title:'Prophet Saaleh and the she-camel',ar:'صَالِح عَلَيْهِ السَّلَام',sub:"Allah's signs, and being kind to animals",slides:[
 {sc:{label:'Rocky mountains under a warm sky',sky:['#F3C9A2','#FCE8D4'],sun:[330,60,20],mountains:{},dunes:['#C9A07E','#B98F6D','#A87E5C']},text:"After the people of 'Aad, there came another people called Thamud. They lived in a rocky land in the north of Arabia."},
 {sc:{label:'Houses carved into the mountains',sky:['#F3C9A2','#FCE8D4'],sun:[60,70,18],mountains:{carved:true},dunes:['#C9A07E','#B98F6D','#A87E5C']},text:"They were very skilful. They carved whole houses right into the mountains!",ay:AY2.tanhituna},
 {sc:{label:'A glowing lantern below the mountains at night',sky:NIGHT,stars:true,moon:true,mountains:{c:'#6E5A6E',d:'#4E3E4E'},lantern:[200,128],dunes:NIGHTD},text:"Allah sent them Prophet Saaleh, alayhis salaam, with the same message as every Prophet:",ay:AY2.thamud},
 {sc:{label:'A stone well in the desert',sky:['#9FD0EE','#E6F4FB'],sun:[80,60,20],well:true,mountains:{carved:true},dunes:['#D9B48E','#C9A27C','#B8906A']},text:"The people asked for a miracle. So Allah sent them a special she-camel as a sign. Saaleh told them:",ay:AY2.naqah},
 {sc:{label:'The well with water shining',sky:['#9FD0EE','#E6F4FB'],sun:[320,60,20],well:true,dunes:['#D9B48E','#C9A27C','#B8906A']},text:"She would drink from the well on one day, and the people would drink on the next. Allah was testing them.",ay:AY2.shirb},
 {sc:{label:'The carved mountains under a stormy sky',sky:['#5E6472','#A3A9B5'],mountains:{carved:true,c:'#8E7466',d:'#6E5648'},dunes:['#9C8C7C','#8C7C6C','#7C6C5C']},text:"But the proud ones did not like it. They refused to believe Saaleh, and they hurt the she-camel. Saaleh warned them: you have three days.",ay:AY2.aqaruha},
 {sc:{label:'Empty carved houses in silence',sky:['#8D8577','#C4B8A2'],mountains:{carved:true,c:'#9C8676',d:'#7C6658'},dunes:['#B8A07E','#A88E6B','#97805E']},text:"Then a mighty blast came, and the people who refused were gone, as if they had never lived in those houses."},
 {sc:{label:'A calm oasis with palms and water',sky:['#F7C9A8','#FDEBD9'],sun:[80,150,22],palms:[[120,1],[290,.85],[330,1.05]],water:true,dunes:['#C9D89A','#AFC97E','#97B868']},text:"Allah saved Saaleh and the believers with him, by His mercy.",ay:AY2.savedSaaleh},
 {sc:{label:'A glowing lantern beside an open Qur\'an',sky:NIGHT,stars:true,lantern:[90,104],book:true,dunes:NIGHTD},text:"What do we learn? When Allah shows us His signs, we believe and obey. We keep our promises. And we are always kind to animals, because Allah sees how we treat them."}],
 quiz:[{q:'What did the people of Thamud carve?',o:['Houses in the mountains','Boats','Statues of animals'],why:'They carved houses into the mountains.'},
  {q:'What sign did Allah send to Thamud?',o:['A special she-camel','A big ship','A golden tree'],why:'The she-camel of Allah was a sign for them.'},
  {q:'How did they share the water?',o:['She drank one day, they drank the next','They never shared','Only at night'],why:'She had her day to drink, and they had theirs.'},
  {q:'Who did Allah save?',o:['Saaleh and the believers','Only the strongest','Nobody'],why:'Allah saved Saaleh and those who believed, by His mercy.'}]},
{id:'st-ibrahim',pid:'ibrahim',title:'Prophet Ibrahim and the fire',ar:'إِبْرَاهِيم عَلَيْهِ السَّلَام',sub:'Thinking for yourself, and trusting Allah',slides:[
 {sc:{label:'A town at night with lamps glowing',sky:NIGHT,stars:true,town:{lit:true,c:'#6E6A8A',d:'#4E4A6A'},dunes:NIGHTD},text:"Prophet Ibrahim, alayhis salaam, grew up among people who worshipped statues and stars. Even his own father made statues."},
 {sc:{label:'One bright star in the night sky',sky:NIGHT,stars:true,bigstar:[260,60],dunes:NIGHTD},text:"One night he saw a bright star. To make his people think, he said: Is this my Rabb? But when the star set and disappeared, he said:",ay:AY2.afilin},
 {sc:{label:'The moon rising, then the sun',sky:['#5E6F9C','#F3C9A2'],fullmoon:[90,60,18],sun:[310,140,26],dunes:['#C9A07E','#B98F6D','#A87E5C']},text:"Then he saw the moon rising, and then the big shining sun. Both of them set too. Things that disappear cannot be Allah, because Allah is always there."},
 {sc:{label:'Sunrise over the earth',sky:['#F7C9A8','#FDEBD9'],sun:[200,150,26],dunes:['#C9D89A','#AFC97E','#97B868']},text:"So Ibrahim told them clearly who he worshipped:",ay:AY2.wajjahtu},
 {sc:{label:'A row of stone blocks in a hall',sky:['#C8B9A6','#E9DFD2'],noGround:true,town:{c:'#B9A78E',d:'#97836A',y:200}},text:"He asked his people:",ay:AY2.tamathil},
 {sc:{label:'Broken stone pieces and one big block, with an axe',sky:['#C8B9A6','#E9DFD2'],blocks:true,dunes:['#D8CBB8','#C8BBA8','#B8AB98']},text:"One day, when everyone had gone out, Ibrahim broke the statues into pieces, all except the biggest one.",ay:AY2.judhadh},
 {sc:{label:'The biggest block standing alone',sky:['#B8A890','#E0D4C2'],blocks:true,dunes:['#D8CBB8','#C8BBA8','#B8AB98']},text:"The people were furious. Ibrahim said: Ask the biggest one, if they can speak! He wanted them to think: how can something that cannot speak be a god?",ay:AY2.kabiruhum},
 {sc:{label:'A huge fire burning',sky:['#2B1E2E','#5A3A3E'],fire:'hot',dunes:['#6E4A3A','#5E3E30','#4E3226']},text:"Instead of thinking, they built a huge fire and threw Ibrahim into it. But Allah said:",ay:AY2.bardan},
 {sc:{label:'Cool flames and flowers',sky:['#A8D8EE','#E8F6FB'],fire:'cool',flowers:true,dunes:['#A9C98A','#8DB873','#76A35E']},text:"The fire became cool and safe! Ibrahim came out without a single burn, because Allah protects the people who trust Him."},
 {sc:{label:'A glowing lantern beside an open Qur\'an',sky:NIGHT,stars:true,lantern:[90,104],book:true,dunes:NIGHTD},text:"What do we learn? Use your mind: only the One who created everything deserves worship. Be brave for the truth. And trust Allah, because nothing can harm us unless He allows it."}],
 quiz:[{q:'Why did Ibrahim say he did not love the star?',o:['Because it set and disappeared','It was too small','It was too bright'],why:'Things that set and disappear cannot be Allah.'},
  {q:'Which statue did Ibrahim leave unbroken?',o:['The biggest one','The smallest one','None'],why:'He left the biggest one so they would think.'},
  {q:'What did Allah tell the fire?',o:['Be cool and safe for Ibrahim','Burn brighter','Go out'],why:'Ya naru kuni bardan wa salaman ala Ibrahim.'},
  {q:'Who protected Ibrahim?',o:['Allah','The statues','His neighbours'],why:'Allah protects those who trust Him.'}]},
{id:'st-yunus',pid:'yunus',title:'Prophet Yunus in the darkness',ar:'يُونُس عَلَيْهِ السَّلَام',sub:'The dua that Allah answers',slides:[
 {sc:{label:'A big city beside a river',sky:['#9FD0EE','#E6F4FB'],sun:[330,50,18],town:{},river:true,dunes:['#C9D89A','#AFC97E','#97B868']},text:"Allah sent Prophet Yunus, alayhis salaam, to the people of a big city.",ay:AY2.yunus},
 {sc:{label:'The city under an evening sky',sky:['#C7A0B8','#F1D9CF'],town:{},river:true,dunes:['#B9A78E','#A8957B','#97836A']},text:"He called them to Allah for a long time, but they would not listen. Yunus became upset and left them, before Allah told him to go.",ay:AY2.mughadiban},
 {sc:{label:'A sailing ship on the sea',sky:['#9FD0EE','#E6F4FB'],sun:[80,50,18],ship:[220,166,1],sea:['#4F8FB4','#3C7698']},text:"He went down to the sea and boarded a ship full of people.",ay:AY2.mashhun},
 {sc:{label:'The ship in a stormy sea',sky:['#3B4250','#6E7686'],cloud:[40,10,1.5,'#2F3440'],rain:true,ship:[220,166,1],sea:['#335C78','#244660']},text:"A storm came, and the ship was too heavy. They drew lots to choose who must go into the sea, and the lot fell on Yunus."},
 {sc:{label:'Deep dark sea at night',sky:['#0E1A2E','#1E3150'],stars:true,sea:['#16324A','#0E2236']},text:"In the sea, by Allah's command, a huge fish swallowed Yunus whole.",ay:AY2.iltaqamahu},
 {sc:{label:'Complete darkness with one small light',sky:['#050810','#0B1424'],noGround:true,glow:[200,120]},text:"Inside the fish, in the darkness of the night, the sea and the fish, Yunus called on Allah with this dua:",ay:AY2.duaYunus},
 {sc:{label:'Light breaking over the sea',sky:['#F7C9A8','#FDEBD9'],sun:[200,160,30],sea:['#6FA7C8','#5A92B4']},text:"Allah heard him, even there. He answered Yunus and saved him. And Allah says He saves the believers in the same way.",ay:AY2.istajabna},
 {sc:{label:'Big green leaves giving shade on the shore',sky:['#9FD0EE','#E6F4FB'],sun:[330,50,18],leaves:true,dunes:['#E8D3A8','#DCC496','#CEB484']},text:"The fish put Yunus out on the shore. He was weak and tired, so Allah made a gourd plant grow over him to give him shade.",ay:AY2.yaqtin},
 {sc:{label:'The city by the river with lamps glowing',sky:['#F7C9A8','#FDEBD9'],town:{lit:true},river:true,dunes:['#C9D89A','#AFC97E','#97B868']},text:"Then Yunus went back to his city. This time, all of the people believed!",ay:AY2.miah},
 {sc:{label:'A glowing lantern beside an open Qur\'an',sky:NIGHT,stars:true,lantern:[90,104],book:true,dunes:NIGHTD},text:"What do we learn? Never give up on people. When you are sad or in trouble, say the dua of Yunus. Allah hears us even in the darkest place."}],
 quiz:[{q:'Where did Yunus go when he left his city?',o:['Onto a ship at sea','To the mountains','Into a forest'],why:'He boarded a fully loaded ship.'},
  {q:'What happened to Yunus in the sea?',o:['A huge fish swallowed him','He swam home','He found an island'],why:"By Allah's command, a big fish swallowed him."},
  {q:'What did Yunus say inside the fish?',o:['La ilaha illa anta, subhanaka, inni kuntu minaz-zalimin','Nothing','Help me, fish'],why:'This is the dua of Yunus. Allah answered it.'},
  {q:'What happened when Yunus went back to his city?',o:['All the people believed','Nobody listened','The city was empty'],why:'A hundred thousand or more believed.'}]}
];

const STORIES_OLD=[
{id:'st1',title:'Prophet Huud and the people of \'Aad',ar:'هُود عَلَيْهِ السَّلَام',sub:'A story about thanking Allah and saying Astaghfirullah',slides:[
 {sc:{label:'Sand hills in the desert at sunrise',sky:['#F8C77E','#FBE3B8'],sun:[300,120,26]},text:"Long ago, after the time of Prophet Nuh, there lived a people called 'Aad. Their home was al-Ahqaf, a land of curving sand hills in the south of Arabia."},
 {sc:{label:'A city of very tall pillars under a blue sky',sky:['#7FB6E0','#D6ECF7'],sun:[340,50,18],pillars:{}},text:"Allah gave the people of 'Aad so much: strong bodies, gardens, springs of water, animals and children. They built a great city with very tall pillars.",ay:AY.fajr},
 {sc:{label:'The tall city under a dark purple sky',sky:['#4B3A6B','#9B7BA8'],moon:true,pillars:{c:'#B98A5E',t:'#8E6440'},dunes:['#B88A5A','#A67848','#946639']},text:"But they forgot who gave them all of this. They worshipped idols that could not hear them or help them. They became proud and said: Who is stronger than us?"},
 {sc:{label:'A glowing lantern on the sand at night',sky:['#1E2A4A','#3D4E7A'],stars:true,moon:true,lantern:[200,118],dunes:['#B88A5A','#A67848','#946639']},text:"So Allah sent them a Prophet from among their own people: Huud, alayhis salaam. He told them:",ay:AY.call},
 {sc:{label:'A rain cloud over green sand hills',sky:['#9CC3DE','#E3F0F7'],cloud:[110,40,1.1,'#F4F7FA'],rain:true,dunes:['#A9C98A','#8DB873','#76A35E']},text:"Huud gave them good advice. If they asked Allah to forgive them, Allah would send them rain and make them even stronger.",ay:AY.istighfar},
 {sc:{label:'The tall city under a stormy grey sky',sky:['#5E6472','#A3A9B5'],pillars:{c:'#B98A5E',t:'#8E6440'},dunes:['#B88A5A','#A67848','#946639']},text:"But they would not listen. They said: Huud, you have not brought us any proof. We will never leave our gods because of what you say. Huud stayed patient and brave.",ay:AY.trust},
 {sc:{label:'Dry, cracked ground under a hot sun',sky:['#F6B26B','#FCE1B3'],sun:[200,70,34,],sunC:'#FFB547',cracks:true,dunes:['#E4B57B','#D8A464','#C99252']},text:"Their land became very dry. Day after day they waited for rain, but it did not come."},
 {sc:{label:'A huge dark cloud coming toward the valley',sky:['#C9B79C','#EADFCB'],cloud:[60,30,1.9,'#5B5F6E'],dunes:['#D9A05E','#C98B4A','#B87A3D']},text:"One day they saw a huge cloud coming toward their valleys. They were happy and said:",ay:AY.cloud},
 {sc:{label:'A strong wind blowing sand across the desert',sky:['#8D8577','#C4B8A2'],wind:true,dunes:['#B8A07E','#A88E6B','#97805E']},text:"But it was not rain. It was a fierce, freezing wind. It blew for seven nights and eight days without stopping. Only the empty homes of those who refused were left."},
 {sc:{label:'A calm oasis with palm trees and water at dawn',sky:['#F7C9A8','#FDEBD9'],sun:[80,150,22],palms:[[120,1],[290,.85],[330,1.05]],water:true,dunes:['#C9D89A','#AFC97E','#97B868']},text:"Allah saved Huud and the people who believed with him, by His mercy. They lived on, thanking Allah.",ay:AY.saved},
 {sc:{label:'A glowing lantern beside an open Qur\'an',sky:['#1E2A4A','#3D4E7A'],stars:true,lantern:[90,104],book:true,dunes:['#B88A5A','#A67848','#946639']},text:"What do we learn? Every blessing we have is from Allah, so we thank Him. We worship Allah alone. We are never proud, because Allah is stronger than everyone. And we say Astaghfirullah often, because Allah loves to forgive."}
 ],quiz:[
  {q:"Where did the people of 'Aad live?",o:['In al-Ahqaf, a land of sand hills','On an island in the sea','In a snowy forest'],why:"They lived in al-Ahqaf, in the south of Arabia."},
  {q:'What did Prophet Huud ask his people to do?',o:['Worship Allah alone','Build taller pillars','Leave their homes'],why:'He said: O my people, worship Allah. You have no god other than Him.'},
  {q:'What did Huud say would bring them rain?',o:["Asking Allah's forgiveness",'Shouting at the sky','Praying to idols'],why:'Saying Astaghfirullah and turning back to Allah brings His mercy.'},
  {q:'What came instead of rain?',o:['A fierce wind for seven nights and eight days','A big flood','Snow'],why:'A freezing wind blew for seven nights and eight days.'},
  {q:'Who did Allah save?',o:['Huud and those who believed with him','Only the strongest people','Nobody'],why:'Allah saved Huud and the believers by His mercy.'}]}
];

function lastRead(){try{return +localStorage.getItem('ll-read-'+(ui.chatAs?'parent':ui.kid))||0}catch(e){return 0}}
function markRead(){try{localStorage.setItem('ll-read-'+(ui.chatAs?'parent':ui.kid),String(Date.now()))}catch(e){}}
function unreadCount(){const t=lastRead();return chatList().filter(c=>c.at>t&&c.from!==ui.kid).length}
function whosHere(){
  if(mode!=='db')return '';
  const others=Object.keys(S.kids).filter(k=>k!==ui.kid);
  others.sort((a,b)=>isOnline(b)-isOnline(a));
  const n=unreadCount();
  return `<section class="sect"><div class="spread"><h2 class="h2s">Family</h2><button class="btn sm ${n?'rose':'ghost'}" data-act="chat">💬 Family chat${n?` · ${n} new`:''}</button></div>
   ${others.length?`<div class="family">${others.map(k=>{const on=isOnline(k),p=(S.presence||{})[k]||{};
    return `<button class="fam ${on?'on':''} ${ui.waveTo===k?'sel':''}" data-act="waveTo" data-k="${k}" title="${esc(on?(p.doing||'Online'):seenAgo(k))}" aria-label="${esc(S.kids[k].name)}, ${esc(on?(p.doing||'online'):seenAgo(k))}"><span class="famav">${symEl(k,50)}<i class="dot"></i></span><b>${esc(S.kids[k].name)}</b></button>`}).join('')}</div>`

function handleChat(){
  const now=Date.now();
  for(const c of chatList()){if(now-c.at>30*86400000)del('fam/'+c.id)}
  const extra=chatList().length-150;if(extra>0)chatList().slice(0,extra).forEach(c=>del('fam/'+c.id));
  for(const c of chatList()){
    if(c.at<SESSION_START||c.from===ui.kid||!ui.kid||chatShown[c.id])continue;
    if(c.to===ui.kid&&ui.screen!=='chat'){chatShown[c.id]=1;showWave(null,{from:c.from,msg:c.text})}
  }
}
const SESSION_START=Date.now(),chatShown={};
let waveShown={};
function handleWaves(){
  const now=Date.now();
  for(const id in (S.waves||{})){const w=S.waves[id];
    if(!w||now-w.at>86400000){del('fam/'+id);continue}
    if(w.to!==ui.kid||waveShown[id])continue;
    waveShown[id]=1;showWave(id,w);
  }
}
function showWave(id,w){
  let o=document.getElementById('waveov');if(!o){o=document.createElement('div');o.id='waveov';o.className='waveov';o.setAttribute('role','status');document.body.appendChild(o)}
  const from=S.kids[w.from];if(!from){if(id)del('fam/'+id);return}
  const card=document.createElement('div');card.className='wavecard';
  card.innerHTML=`<span class="waveav">${symEl(w.from,52)}</span><div class="wtx"><b>${esc(from.name)}</b><p>${esc(w.msg)}</p><div class="row">${REPLIES.map(r=>`<button class="btn sm ghost" data-r="${esc(r)}">${esc(r)}</button>`).join('')}<button class="btn sm" data-close>OK</button></div></div>`;
  card.addEventListener('click',e=>{const r=e.target.closest('[data-r]');if(r){sendWave(w.from,r.dataset.r);toast('Sent!')}if(r||e.target.closest('[data-close]'))card.remove()});
  o.appendChild(card);if(id){del('fam/'+id);delete S.waves[id]}
  setTimeout(()=>card.isConnected&&card.remove(),45000);
}

function subscribeAll(onErr){
  const local=JSON.parse(JSON.stringify(S));let first=true;
  const err=e=>{onErr&&onErr(e)};
  const coll=(name,key)=>db.collection(name).onSnapshot(s=>{
    const m={};s.docs.forEach(x=>m[x.id]=x.data());S[key]=m;saveLocal();soft();
  },err);
  let merged=false;
  db.collection('kids').onSnapshot(s=>{
    const m={};s.docs.forEach(x=>m[x.id]=x.data());
    if(!merged&&s.metadata&&s.metadata.fromCache===false){merged=true;
      for(const id in (local.kids||{}))if(!m[id]&&local.kids[id]&&local.kids[id].name){ // a child added on this device before it joined the family
        m[id]=local.kids[id];put('kids/'+id,local.kids[id]);
        if(local.progress&&local.progress[id]){S.progress[id]=local.progress[id];put('progress/'+id,local.progress[id])}}}
    S.kids=m;saveLocal();soft();
  },err);
  coll('progress','progress');coll('deeds','deeds');
  db.collection('fam').onSnapshot(async s=>{
    const m={};s.docs.forEach(x=>m[x.id]=x.data());
    const wasFirst=first;
    if(first){first=false;
      if(!m.settings&&local.settings&&local.settings.parentPin){ // move this device's data into the family space once
        S=Object.assign(local,{access:S.access||[]});await put('fam/settings',S.settings);await put('fam/approvals',S.approvals);
        for(const k in S.kids)await put('kids/'+k,S.kids[k]);
        for(const k in S.progress)await put('progress/'+k,S.progress[k]);
        for(const k in S.deeds)await put('deeds/'+k,S.deeds[k]);
        return;}}
    S.presence={};S.waves={};
    S.chat={};
    for(const id in m){if(id.startsWith('p-'))S.presence[id.slice(2)]=m[id];else if(id.startsWith('w-'))S.waves[id]=m[id];else if(id.startsWith('c-'))S.chat[id]=m[id]}
    handleWaves();handleChat();
    const ch=s.docChanges?s.docChanges():[];
    if(!wasFirst&&ch.length&&ch.every(c=>/^[pwc]-/.test(c.doc.id))){if(ui.screen==='home'||ui.screen==='chat')soft();return}
    S.settings=Object.assign({},m.settings||{});S.approvals=Object.assign({},m.approvals||{});
    S.access=(m.access&&m.access.members)||[];
    dbReady=true;saveLocal();soft();
  },err);
}

function connectFirebase(){
  firebase.initializeApp(window.LL_FB);

  fb={auth:firebase.auth(),fs,user:null,state:'checking'};
  fb.auth.onAuthStateChanged(u=>{
    fb.user=u;
    if(u){fb.state='in';db=fs;mode='db';
      subscribeAll(e=>{if(e&&e.code==='permission-denied'&&fb.state!=='denied'){fb.state='denied';mode='local';db=null;watchOwnRequest();soft()}});
      if(isOwner())fs.collection('requests').onSnapshot(s=>{fb.requests=s.docs.map(d=>Object.assign({uid:d.id},d.data()));soft()},()=>{});}
    else{fb.state='out';mode='local';db=null}
    soft();
  });
  fb.auth.getRedirectResult().catch(()=>{});
}

function letterSteps(l){

  const qs=shuffle(l.set.flatMap(x=>[
    {q:`Which letter is ${x[1]}?`,o:[x[0],...shuffle(pool.filter(y=>y!==x)).slice(0,3).map(y=>y[0])],glyph:true,why:`${x[1]} looks like this: ${x[0]}`},

    ...(PICW[x[0]]?[{q:`${PICW[x[0]][2][0].toUpperCase()+PICW[x[0]][2].slice(1)} is ${PICW[x[0]][1]}. Which letter does it start with?`,big:PICW[x[0]][0],o:[x[0],...shuffle(pool.filter(y=>y!==x)).slice(0,3).map(y=>y[0])],glyph:true,why:`${PICW[x[0]][1]} (${PICW[x[0]][2]}) starts with ${x[1]}: ${x[0]}`}]:[])]));

function curStep(){return ui.L.steps[ui.L.i]}
function prepStep(){const s=curStep();const st={};
  if(s.t==='quiz'){st.q=0;st.order=s.qs.map(q=>shuffle(q.o));st.ans=null}
  if(s.t==='tap')st.open={};
  if(s.t==='letters')st.open={};
  if(s.t==='sort'){st.items=shuffle(s.items);st.k=0;st.ans=null}
  if(s.t==='match'){st.left=shuffle(s.pairs.map((p,i)=>i));st.right=shuffle(s.pairs.map((p,i)=>i));st.sel=null;st.done={}}
  if(s.t==='count')st.c=0;
  if(s.t==='story')st.k=0;
  if(s.t==='stack'){st.pool=shuffle(s.items.map((x,i)=>i));st.placed=[]}
  if(s.t==='order'){st.pool=shuffle(s.chunks.map((c,i)=>i));st.placed=[]}
  ui.L.st=st;}
function canNext(){const s=curStep(),st=ui.L.st;
  if(s.t==='tap')return Object.keys(st.open).length===s.items.length;

  if(s.t==='count')return st.c>=s.n;
  if(s.t==='story')return st.k>=s.slides.length-1;
  if(s.t==='stack')return st.placed.length===s.items.length;
  if(s.t==='order')return st.placed.length===s.chunks.length;
  if(s.t==='match')return Object.keys(st.done).length===s.pairs.length;
  if(s.t==='sort')return st.k>=s.items.length;
  if(s.t==='quiz')return st.q>=s.qs.length;

  if(others.length<n-1)others=others.concat(shuffle(LETTERS.map(x=>x[0]).filter(x=>x!==correct&&!others.includes(x))));

function slapRound(){
  const tg=pick(G.pool);G.target=tg[0];G.lock=false;
  $('mid').textContent='First to 7';
  for(const p of [0,1]){
    const n=p===0?(G.pool.length>=8?6:4):Math.min(4+G.h*2,12);
    $('q'+p).innerHTML=`Slap <b>${tg[1]}</b>`;
    const opts=optsFor(p,tg[0],n),f=$('f'+p);
    if(p===1&&G.h){f.innerHTML='<div class="sgrid" style="--c:1"><span class="hq muted">Get ready...</span></div>';later(()=>{if(G.target===tg[0]&&!G.over)f.innerHTML=gridHTML(1,opts,'slap')},G.h*300)}
    else f.innerHTML=gridHTML(p,opts,'slap');
  }
  speak(tg[2]);
}
function slapTap(p,v,b){
  if(G.lock||isFrozen(p))return;
  if(v===G.target){G.lock=true;b.classList.add('hit');G.score[p]++;setScore(p);if(G.score[p]>=7)return endDuel(p);later(slapRound,450)}
  else{b.classList.add('miss');freeze(p,1000)}
}

/* Dot Catcher */
function dotsStart(){
  G.fams=FAMILIES.filter(f=>f.some(x=>G.poolSet.has(x)));
  G.end=performance.now()+60000;dotsTarget();
  let last=performance.now(),spawn=[0,0];
  const loop=now=>{if(G.over)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    const left=Math.max(0,Math.ceil((G.end-now)/1000));$('mid').textContent=left+'s';
    if(left<=0)return endDuel(G.score[0]===G.score[1]?-1:G.score[0]>G.score[1]?0:1);
    for(const p of [0,1]){
      const every=p===1?Math.max(420,900-G.h*150):900;
      if(now-spawn[p]>every){spawn[p]=now;dotsSpawn(p)}
      const fh=$('f'+p).clientHeight||300,sp=(p===1?1+G.h*.3:1)*fh*.32;
      G.items[p]=G.items[p].filter(it=>{it.y+=sp*dt;if(it.y>fh+40){it.el.remove();return false}it.el.style.transform=`translateY(${it.y}px)`;return true});
    }
    G.raf=requestAnimationFrame(loop)};
  G.raf=requestAnimationFrame(loop);
}
function dotsTarget(){
  const fam=pick(G.fams),learnedIn=fam.filter(x=>G.poolSet.has(x));G.fam=fam;G.target=pick(learnedIn);
  for(const p of [0,1]){$('q'+p).innerHTML=`Catch only <span class="ar" style="display:inline">${G.target}</span> ${esc(LBY[G.target][1])}`;G.items[p].forEach(it=>it.el.remove());G.items[p]=[]}
  speak(LBY[G.target][2]);
}
function dotsSpawn(p){
  let v;if(Math.random()<.4)v=G.target;else{let d=G.fam.filter(x=>x!==G.target);if(p===1&&G.h)d=d.concat(shuffle(LETTERS.map(x=>x[0]).filter(x=>!G.fam.includes(x))).slice(0,G.h*2));v=pick(d)}
  const el=document.createElement('button');el.className='fall';el.dataset.g='dot';el.dataset.p=p;el.dataset.v=v;el.textContent=v;
  el.style.left=(12+Math.random()*76)+'%';el.style.top='-64px';$('f'+p).appendChild(el);G.items[p].push({el,y:0});
}
function dotTap(p,v,b){
  if(isFrozen(p))return;
  G.items[p]=G.items[p].filter(it=>it.el!==b);b.remove();
  if(v===G.target){G.score[p]++;setScore(p);G.catches++;if(G.catches%4===0)dotsTarget()}
  else{G.score[p]=Math.max(0,G.score[p]-1);setScore(p);freeze(p,700)}
}

/* Tug of War */
function tugRound(){
  G.lock=false;const tg=pick(G.pool),byName=Math.random()<.5;G.target=tg[0];G.byName=byName;
  $('mid').innerHTML='<div class="rope"></div>';
  for(const p of [0,1]){
    const n=p===0?(G.pool.length>=6?4:3):Math.min(4+G.h*2,10);
    $('q'+p).innerHTML=byName?`Which letter is <b>${esc(tg[1])}</b>?`:`What is this letter? <span class="ar">${tg[0]}</span>`;
    const opts=optsFor(p,tg[0],n),f=$('f'+p);
    if(p===1&&G.h){f.innerHTML='';later(()=>{if(G.target===tg[0]&&!G.over)f.innerHTML=gridHTML(1,opts,byName?'tug':'tugN')},G.h*300)}
    else f.innerHTML=gridHTML(p,opts,byName?'tug':'tugN');
  }
  if(byName)speak(tg[2]);
}
function tugTap(p,v,b){
  if(G.lock||isFrozen(p))return;
  if(v===G.target){G.lock=true;b.classList.add('hit');G.rope+=p===0?1:-1;G.score[p]++;setScore(p);
    const r=G.rope;$('dw').style.gridTemplateRows=`${50+r*7}fr auto ${50-r*7}fr`;
    if(Math.abs(r)>=5)return endDuel(r>0?0:1);later(tugRound,450)}
  else{b.classList.add('miss');freeze(p,1000)}
}

   case 'mR':{if(st.sel==null){toast('Tap a name on the left first');break}const r=+b.dataset.i;if(r===st.sel){st.done[r]=1;st.sel=null}else{L.miss++;toast('Not a match. Try again');st.sel=null}render();break;}
   case 'ans':{const q=s.qs[st.q];st.ans=b.dataset.v;if(st.ans!==q.o[0])L.miss++;else if(q.big||q.glyph){const x=LETTERS.find(y=>y[1]===q.o[0]||y[0]===q.o[0]);x&&speak(x[2])}render();break;}
   case 'qNext':st.q++;st.ans=null;if(st.q>=s.qs.length){if(L.i<L.steps.length-1){L.i++;prepStep()}else{finishLesson();break}}render();break;
   case 'count':st.c++;render();break;
   case 'avatar':ui.avDraft=null;go('avatar');break;
   case 'openCert':{const c=certList(ui.kid).find(x=>x.key===b.dataset.key);if(!c)break;ui.certBack=ui.screen==='duelres'?'duelPick':'home';go('cert',{cert:c});break;}
   case 'certShare':if(certCanvas)shareCanvas(certCanvas,'little-lantern-certificate',`${kidName()} ${ui.cert.line}! MashaAllah`);break;
   case 'avSet':{const k=b.dataset.k,v=b.dataset.v;ui.avDraft[k]=k==='head'||k==='holds'?v:k==='glasses'?v==='1':+v;render();break;}
   case 'avSave':{S.kids[ui.kid].av=Object.assign({},ui.avDraft);saveKid(ui.kid);toast('Avatar saved!');go('home');break;}
   case 'avSticker':{if(!S.kids[ui.kid].av){S.kids[ui.kid].av=Object.assign({},ui.avDraft);saveKid(ui.kid)}makeSticker(b.dataset.w).then(c=>shareCanvas(c,'little-lantern-sticker',b.dataset.w));break;}
   case 'stk':{const i=+b.dataset.i;if(i===st.placed.length){st.placed.push(i);render()}else{L.miss++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('Not yet. What comes before it?')}break;}
   case 'sNext':if(st.k<s.slides.length-1){st.k++;render()}break;
   case 'sPrev':if(st.k>0){st.k--;render()}break;
   case 'chunk':{const i=+b.dataset.i;if(i===st.placed.length)st.placed.push(i);else{L.miss+=0;toast('Which piece comes first?');b.classList.add('shake');break}render();break;}
   case 'daddyCheck':go('pin',{pin:'',pinFor:'daddyCheck'});break;
   case 'waveTo':ui.waveTo=ui.waveTo===b.dataset.k?null:b.dataset.k;render();break;
   case 'sendWave':sendWave(ui.waveTo,b.dataset.m);toast(`Sent to ${S.kids[ui.waveTo].name}!`);ui.waveTo=null;render();break;
   case 'chat':ui.chatAs=null;go('chat');break;
   case 'chatSend':sendChat(b.dataset.t);render();break;
   case 'chatDel':{const id=b.dataset.id;delete S.chat[id];del('fam/'+id);render();break;}
   case 'parentChat':ui.chatAs={name:(fb&&fb.user&&(fb.user.displayName||'').split(' ')[0])||'Grown-up'};go('chat');break;
   case 'chatBackParent':ui.chatAs=null;go('parents');break;
   case 'chatTyping':S.settings.chatTyping=S.settings.chatTyping===false;saveSettings();render();break;
   case 'deedOpen':ui.deedOpen=!ui.deedOpen;render();break;
   case 'deed':{ui.deedOpen=false;const k=uid();S.deeds[k]={kid:ui.kid,text:b.dataset.t,status:'pending',at:Date.now()};saveDeed(k);toast('Sent to Daddy');render();break;}
   case 'savePin':{const v=document.getElementById('ppin').value.trim();if(!/^\d{4}$/.test(v)){toast('Use exactly 4 numbers');break}S.settings.parentPin=v;saveSettings();ui.parent=true;ui.editKid='new';go('parents');break;}
   case 'changePin':{const v=document.getElementById('ppin2').value.trim();if(!/^\d{4}$/.test(v)){toast('Use exactly 4 numbers');break}S.settings.parentPin=v;saveSettings();toast('PIN updated');render();break;}
   case 'editKid':ui.editKid=id||null;ui.sym=null;render();break;
   case 'sym':ui.sym=b.dataset.s;{const n=document.getElementById('kname')?.value,p=document.getElementById('kpin')?.value;render();if(n!=null)document.getElementById('kname').value=n;if(p!=null)document.getElementById('kpin').value=p;}break;
   case 'saveKid':{const n=document.getElementById('kname').value.trim(),p=document.getElementById('kpin').value.trim();if(!n){toast('Add a name');break}if(p&&!/^\d{4}$/.test(p)){toast('PIN must be 4 numbers, or empty');break}
     const k=ui.editKid==='new'?uid():ui.editKid;S.kids[k]=Object.assign({},S.kids[k]||{},{name:n,pin:p,symbol:ui.sym||S.kids[k]?.symbol||'🌸'});saveKid(k);if(!S.progress[k]){prog(k);saveProg(k)}ui.editKid=null;toast('Saved');render();break;}
   case 'delKid':{const k=ui.editKid;delete S.kids[k];del('kids/'+k);ui.editKid=null;toast('Removed');render();break;}
   case 'appr':S.approvals[id]=true;saveApprovals();render();break;
   case 'apprAll':WORLDS[b.dataset.w].lessons.forEach(l=>S.approvals[l.id]=true);saveApprovals();toast('Approved');render();break;
   case 'prev':ui.openPrev=ui.openPrev===id?null:id;render();break;
   case 'deedOk':S.deeds[id].status='ok';saveDeed(id);toast('A flower grew');render();break;
   case 'deedNo':delete S.deeds[id];del('deeds/'+id);render();break;
   case 'addDeed':{const kid=document.getElementById('dkid').value,t=document.getElementById('dtext').value.trim();if(!t){toast('Write the good deed');break}const k=uid();S.deeds[k]={kid,text:t,status:'ok',at:Date.now()};saveDeed(k);toast('A flower grew');render();break;}
  }
});
render();
</script>

</body>
</html>
